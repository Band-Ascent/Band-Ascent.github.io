  S.user.examDate = $("#obDate")?.value||"";
  S.user.dailyMinutes = parseInt($("#obMins")?.value||"30",10);
  save();
  buildCalibration(); go("assess"); stepCalibration();
}
function retakeCalibration(){
  modal(`<h2>Retake the calibration test?</h2>
    <p class="muted" style="margin:10px 0 18px">Your XP, streak and badges are kept. A new band estimate is added to your history so you can see the movement.</p>
    <div class="rowwrap" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn gold" onclick="closeModal();buildCalibration();go('assess');stepCalibration()">Start test</button>
    </div>`);
}

function buildCalibration(){
  const L = shuffle(BANK.listening).slice(0,2);
  const R = pick(BANK.reading);
  AS = {
    i:0, started:Date.now(),
    theta:{ grammar:6.0, vocab:6.0 },
    used:{ grammar:[], vocab:[] },
    scores:{ listening:{c:0,n:0}, reading:{c:0,n:0} },
    listen:L, listenQs:L.flatMap(s=>s.qs.map(q=>({...q, script:s.script, title:s.title}))),
    read:R,
    gCount:8, vCount:7,
    answers:[], writing:null,
    steps:[]
  };
  AS.steps=[
    {t:"intro"},
    ...AS.listenQs.map((q,i)=>({t:"listen",q,i})),
    {t:"readIntro"},
    ...AS.read.qs.map((q,i)=>({t:"read",q,i})),
    ...Array.from({length:AS.gCount},(_,i)=>({t:"grammar",i})),
    ...Array.from({length:AS.vCount},(_,i)=>({t:"vocab",i})),
    {t:"writing"},
    {t:"done"}
  ];
}

function nextAdaptive(kind){
  const pool = kind==="grammar"?BANK.grammar:BANK.vocab;
  const used = AS.used[kind], th=AS.theta[kind];
  const avail = pool.map((it,idx)=>({it,idx})).filter(x=>!used.includes(x.idx));
  avail.sort((a,b)=>Math.abs(a.it.b-th)-Math.abs(b.it.b-th));
  const chosen = avail[Math.min(Math.random()*2|0, avail.length-1)] || avail[0];
  used.push(chosen.idx);
  return chosen.it;
}

function calibProgress(){
  const total=AS.steps.length-2, done=clamp(AS.i-1,0,total);
  return `<div class="qmeta">
    <div class="rowwrap">
      <span class="pill teal">${esc(sectionName())}</span>
      <span class="tiny mono muted">${done}/${total}</span>
    </div>
    <div style="flex:1;min-width:120px"><div class="bar teal"><i style="width:${Math.round(done/total*100)}%"></i></div></div>
  </div>`;
}
function sectionName(){
  const t=AS.steps[AS.i]?.t;
  return {listen:"Listening",read:"Reading",readIntro:"Reading",grammar:"Grammar & structure",vocab:"Vocabulary",writing:"Writing",intro:"Calibration",done:"Results"}[t]||"Calibration";
}

function stepCalibration(){
  const st=AS.steps[AS.i], host=$("#view-assess");
  if(!st) return;
  if(st.t==="intro"){
    host.innerHTML=`<div class="stage rise" style="max-width:720px;margin:0 auto">
      <div class="eyebrow">Calibration test</div>
      <h2 style="margin:8px 0 12px">Five sections, about 25 minutes</h2>
      <p class="muted small">Work without a dictionary and without pausing. If you are unsure, choose the answer you would choose in the exam — a guess carries information too. The listening items are read aloud by your browser; you can replay each one twice.</p>
      <div class="grid g2" style="margin:18px 0">
        ${[["🎧","Listening","4 items"],["📖","Reading","6 items"],["🔤","Grammar","8 adaptive"],["📚","Vocabulary","7 adaptive"],["✍️","Writing","8 minutes"],["🎙️","Speaking","estimated, confirm later"]]
          .map(([i,a,b])=>`<div class="task"><div class="task-ico">${i}</div><div><div class="task-title">${a}</div><div class="tiny muted">${b}</div></div></div>`).join("")}
      </div>
      <button class="btn gold wide" onclick="AS.i++;stepCalibration()">Begin</button>
    </div>`;
    return;
  }
  if(st.t==="listen") return renderListenStep(st);
  if(st.t==="readIntro"){
    host.innerHTML=`<div class="stage rise" style="max-width:760px;margin:0 auto">
      ${calibProgress()}
      <h2>${esc(AS.read.title)}</h2>
      <p class="muted small" style="margin:6px 0 14px">Read the passage once, then answer six questions. The passage stays on screen.</p>
      <div class="passage">${AS.read.text.split("\n\n").map(p=>`<p style="margin-bottom:12px">${esc(p)}</p>`).join("")}</div>
      <button class="btn wide" style="margin-top:16px" onclick="AS.i++;stepCalibration()">I have read it — start the questions</button>
    </div>`;
    return;
  }
  if(st.t==="read") return renderReadStep(st);
  if(st.t==="grammar"||st.t==="vocab") return renderAdaptiveStep(st.t);
  if(st.t==="writing") return renderWritingStep();
  if(st.t==="done") return finishCalibration();
}

function renderListenStep(st){
  const q=st.q, plays={n:0};
  $("#view-assess").innerHTML=`<div class="stage rise" style="max-width:720px;margin:0 auto">
    ${calibProgress()}
    <div class="card tight" style="background:var(--panel);color:#DCE7EF;border:0;margin-bottom:16px">
      <div class="eyebrow" style="color:#7E9AAF">${esc(q.title)}</div>
      <div class="rowwrap" style="margin-top:10px">
        <button class="btn gold" id="playBtn">▶ Play recording</button>
        <span class="tiny mono" id="playInfo" style="color:#7E9AAF">2 plays available</span>
      </div>
      ${Speech.ok?"":`<p class="small" style="margin-top:10px;color:#F7C46C">Your browser has no speech engine, so the transcript is shown instead.</p><div class="small" style="margin-top:8px;color:#C6D6E2">${esc(q.script)}</div>`}
    </div>
    <h3 style="margin-bottom:12px">${esc(q.q)}</h3>
    <div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  </div>`;
  const btn=$("#playBtn");
  btn.onclick=()=>{
    if(plays.n>=2) return;
    plays.n++; btn.disabled=true; btn.textContent="◼ Playing…";
    $("#playInfo").textContent=`${2-plays.n} play${2-plays.n===1?"":"s"} left`;
    Speech.say(q.script, .92, ()=>{ btn.disabled=plays.n>=2; btn.textContent=plays.n>=2?"No plays left":"▶ Play again"; });
  };
  $$("#opts .opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===q.a;
    AS.scores.listening.n++; if(ok) AS.scores.listening.c++;
    AS.answers.push({sec:"listening",ok,band:q.b});
    $$("#opts .opt").forEach(x=>{x.classList.add("locked"); if(+x.dataset.i===q.a)x.classList.add("ok");});
    if(!ok) b.classList.add("no");
    Speech.stop();
    later(()=>{AS.i++;stepCalibration();},700);
  });
}

function renderReadStep(st){
  const q=st.q;
  const opts = q.type==="tfng" ? ["True","False","Not given"] : q.opts;
  $("#view-assess").innerHTML=`<div class="stage rise" style="max-width:820px;margin:0 auto">
    ${calibProgress()}
    <div class="split" style="gap:18px">
      <div>
        <span class="pill">${q.type==="tfng"?"True / False / Not given":"Multiple choice"}</span>
        <h3 style="margin:12px 0 14px;font-size:1.1rem">${esc(q.q)}</h3>
        <div id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div id="tip" class="hidden small" style="margin-top:12px;padding:12px;background:var(--gold-soft);border-radius:12px"></div>
      </div>
      <div class="passage" style="max-height:420px">${AS.read.text.split("\n\n").map(p=>`<p style="margin-bottom:11px">${esc(p)}</p>`).join("")}</div>
    </div>
  </div>`;
  $$("#opts .opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===q.a;
    AS.scores.reading.n++; if(ok) AS.scores.reading.c++;
    AS.answers.push({sec:"reading",ok,band:q.b});
    $$("#opts .opt").forEach(x=>{x.classList.add("locked"); if(+x.dataset.i===q.a)x.classList.add("ok");});
    if(!ok) b.classList.add("no");
    const tip=$("#tip"); tip.classList.remove("hidden"); tip.innerHTML=`<b>${ok?"Correct.":"Why the answer is "+esc(opts[q.a])+"."}</b> ${esc(q.tip||"")}`;
    later(()=>{AS.i++;stepCalibration();},ok?1400:2600);
  });
}

function renderAdaptiveStep(kind){
  const it=nextAdaptive(kind);
  $("#view-assess").innerHTML=`<div class="stage rise" style="max-width:680px;margin:0 auto">
    ${calibProgress()}
    <div class="rowwrap" style="margin-bottom:12px">
      <span class="pill gold">difficulty ≈ band ${it.b.toFixed(1)}</span>
      <span class="tiny mono muted">current estimate ${fmtBand(AS.theta[kind])}</span>
    </div>
    <h3 style="font-size:1.15rem;margin-bottom:16px">${esc(it.q)}</h3>
    <div id="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="tip" class="hidden small" style="margin-top:12px;padding:12px;background:var(--gold-soft);border-radius:12px"></div>
  </div>`;
  $$("#opts .opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===it.a;
    AS.theta[kind]=updateTheta(AS.theta[kind], it.b, ok);
    AS.answers.push({sec:kind,ok,band:it.b});
    $$("#opts .opt").forEach(x=>{x.classList.add("locked"); if(+x.dataset.i===it.a)x.classList.add("ok");});
    if(!ok) b.classList.add("no");
    const tip=$("#tip"); tip.classList.remove("hidden");
    tip.innerHTML=`<b>${ok?"Correct.":"Answer: "+esc(it.opts[it.a])+"."}</b> ${esc(it.tip||"")}`;
    later(()=>{AS.i++;stepCalibration();},ok?1200:2400);
  });
}

function renderWritingStep(){
  const w=BANK.writing.assess;
  let left=w.minutes*60;
  $("#view-assess").innerHTML=`<div class="stage rise" style="max-width:760px;margin:0 auto">
    ${calibProgress()}
    <div class="qmeta"><h3>Writing sample</h3><span class="timer" id="wtimer">08:00</span></div>
    <div class="passage" style="max-height:none;margin-bottom:14px">${esc(w.prompt).replace(/\n\n/g,"<br><br>")}</div>
    <p class="tiny muted" style="margin-bottom:10px">${esc(w.note)}</p>
    <textarea class="write" id="wtext" placeholder="Write your response here…" aria-label="Your writing response"></textarea>
    <div class="rowwrap" style="justify-content:space-between;margin-top:12px">
      <span class="mono small muted" id="wcount">0 words</span>
      <button class="btn gold" id="wdone">Submit and see results</button>
    </div>
  </div>`;
  const ta=$("#wtext"), cnt=$("#wcount");
  ta.oninput=()=>{ const n=wordCount(ta.value); cnt.textContent=`${n} words`; cnt.style.color=n>=w.minWords?"var(--mint)":"var(--muted)"; };
  every(()=>{
    left--; const m=String(Math.floor(left/60)).padStart(2,"0"), s=String(left%60).padStart(2,"0");
    const el=$("#wtimer"); if(!el) return;
    el.textContent=`${m}:${s}`; el.classList.toggle("warn",left<=60);
    if(left<=0){ toast("Time is up","Your response has been submitted as written.","⏱️"); submitW(); }
  },1000);
  function submitW(){
    stopAllTimers();
    AS.writing = analyzeWriting(ta.value, {task:2, target:130, minutes:w.minutes});
    AS.writingText = ta.value;
    AS.i++; stepCalibration();
  }
  $("#wdone").onclick=()=>{
    const n=wordCount(ta.value);
    if(n<40){ toast("Too short to score","Write at least 40 words so the analyser has something to work with.","✍️"); return; }
    submitW();
  };
}

/* ------------------------------------------------------ RESULTS + PLAN */
function finishCalibration(){
  const li = AS.scores.listening, rd = AS.scores.reading;
  const lBand = roundBand(shrink(bandFromRatio(li.n?li.c/li.n:0, 8.5), li.n));
  const rBand = roundBand(shrink(bandFromRatio(rd.n?rd.c/rd.n:0, 8.5), rd.n));
  const gBand = roundBand(AS.theta.grammar);
  const vBand = roundBand(AS.theta.vocab);
  const wBand = AS.writing.overall;
  const spk   = roundBand(clamp((gBand+vBand)/2 - 0.5, 3, 9));

  const overall = roundBand((lBand*0.22 + rBand*0.22 + wBand*0.22 + spk*0.14 + gBand*0.1 + vBand*0.1));

  S.bands={ overall, listening:lBand, reading:rBand, writing:wBand, speaking:spk, grammar:gBand, vocab:vBand };
  S.assessed=true;
  S.history.push({ d:todayKey(), t:Date.now(), band:overall, detail:{...S.bands} });
  S.plan = buildPlan();
  save(); touchStreak(); addXP(150,"Calibration"); checkBadges(); try{celebrate();}catch(e){}
  logSession("calibration","Calibration test completed",150,Math.round((Date.now()-AS.started)/60000));

  const rows=[["Listening",lBand],["Reading",rBand],["Writing",wBand],["Speaking",spk],["Grammar",gBand],["Vocabulary",vBand]];
  const weakest=rows.slice(0,4).sort((a,b)=>a[1]-b[1])[0];
  const gap = half(S.user.target - overall);

  $("#view-assess").innerHTML=`<div style="max-width:880px;margin:0 auto">
    <div class="rise" style="margin-bottom:18px">
      <div class="eyebrow">Calibration complete</div>
      <h1 style="margin-top:8px">${S.user.name?esc(S.user.name)+", here":"Here"} is your starting point.</h1>
    </div>
    <div class="split rise">
      <div style="display:flex;flex-direction:column;gap:16px">
        ${dialPanel(overall,"Estimated overall band","calibration result")}
        <div class="card">
          <div class="card-head"><h3>By skill</h3><span class="tiny mono muted">target ${fmtBand(S.user.target)}</span></div>
          ${rows.map(([k,v])=>`<div style="margin-bottom:11px">
            <div class="rowwrap" style="justify-content:space-between"><span class="small"><b>${k}</b></span><span class="mono small">${fmtBand(v)}</span></div>
            <div class="bar ${v>=S.user.target?"mint":""}" style="margin-top:5px"><i style="width:${v/9*100}%"></i></div>
          </div>`).join("")}
          <p class="tiny muted" style="margin-top:12px">Listening and reading are drawn from short sections, so they are deliberately pulled toward the middle — a short test cannot justify an extreme score. Speaking is inferred from your grammar and vocabulary until you record a response in the Speaking Lab.</p>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <h3 style="margin-bottom:10px">What this means</h3>
          <p class="small">${gap<=0
            ? `You are already at or above your target of ${fmtBand(S.user.target)}. The plan will now focus on holding that level under exam conditions and protecting against a bad day.`
            : `You are <b>${gap.toFixed(1)} ${gap===0.5?"of a band":"bands"}</b> below your target of ${fmtBand(S.user.target)}. Realistically that is <b>${gap<=0.5?"4–6 weeks":gap<=1?"8–12 weeks":"3–5 months"}</b> of daily work. Your weakest area is <b>${weakest[0].toLowerCase()}</b>, so it gets the largest share of your plan.`}</p>
        </div>
        ${writingReportCard(AS.writing)}
      </div>
    </div>
    <div class="rowwrap rise" style="margin-top:20px;justify-content:center">
      <button class="btn gold" onclick="go('home')">See my daily plan</button>
      <button class="btn ghost" onclick="go('progress')">View progress board</button>
    </div>
  </div>`;
  paintChrome();
}

/* --------------------------------------------------------- PLAN GENERATOR */
function buildPlan(){
  const b=S.bands, target=S.user.target;
  const skills=[["listening",b.listening],["reading",b.reading],["writing",b.writing],["speaking",b.speaking]].sort((x,y)=>x[1]-y[1]);
  const weeks = S.user.examDate ? clamp(Math.ceil(daysBetween(todayKey(),S.user.examDate)/7),1,52) : 8;
  const focus = skills.map(s=>s[0]);
  const phases=[
    { name:"Foundations", weeks:Math.max(1,Math.round(weeks*0.35)), aim:`Close the mechanical gaps: accuracy in ${focus[0]} and ${focus[1]}, plus 20 new academic words a week.` },
    { name:"Technique",   weeks:Math.max(1,Math.round(weeks*0.4)),  aim:"Work to the clock. Full-length reading sets, timed essays, and speaking answers with structure rather than filler." },
    { name:"Exam shape",  weeks:Math.max(1,weeks-Math.round(weeks*0.35)-Math.round(weeks*0.4)), aim:"Full mock conditions, error log review, and holding your band under pressure." }
  ];
  return { madeOn:todayKey(), weeks, focus, phases, target };
}

/* ------------------------------------------------------- DAILY QUESTS */
const GAME_META={
  rush:{n:"Word Rush",i:"💨",s:"vocab"}, colloc:{n:"Collocation Lock",i:"🔗",s:"vocab"},
  para:{n:"Paraphrase Sprint",i:"🔀",s:"writing"}, forge:{n:"Sentence Forge",i:"🔨",s:"grammar"},
  gap:{n:"Gap Runner",i:"🕳️",s:"grammar"}, dictation:{n:"Echo Dictation",i:"🎧",s:"listening"},
  skim:{n:"Skim & Scan",i:"🔍",s:"reading"}, write:{n:"Writing Lab",i:"✍️",s:"writing"},
  speak:{n:"Speaking Lab",i:"🎙️",s:"speaking"}
};
function todayQuests(){
  const d=todayKey();
  if(S.quests.date!==d){
    const focus=(S.plan&&S.plan.focus)||["writing","speaking","reading","listening"];
    const bySkill=g=>GAME_META[g].s;
    const all=Object.keys(GAME_META);
    const primary = all.filter(g=>bySkill(g)===focus[0]);
    const second  = all.filter(g=>bySkill(g)===focus[1]);
    const rest    = shuffle(all.filter(g=>!primary.includes(g)&&!second.includes(g)));
    const chosen=[ pick(primary.length?primary:rest), pick(second.length?second:rest), rest[0], rest[1] ]
      .filter((v,i,a)=>v&&a.indexOf(v)===i).slice(0,4);
    S.quests={ date:d, items:chosen.map(g=>({ id:g, label:GAME_META[g].n, xp:g==="write"||g==="speak"?60:40, done:false })) };
    save();
  }
  return S.quests.items;
}
function completeQuest(id){
  const q=todayQuests().find(x=>x.id===id);
  if(q && !q.done){ q.done=true; save(); addXP(q.xp,"Daily task");
    if(todayQuests().every(x=>x.done)){ celebrate(); toast("Day complete","Every task in today's plan is done. That is how bands move.","🎉"); }
  }
}

/* ============================ WRITING ANALYSER ============================
   A transparent, rule-based estimate across the four public IELTS criteria.
   It is indicative, not an official score — the report says so plainly.     */
const COHESIVE=["however","therefore","moreover","furthermore","nevertheless","consequently","in addition","for instance","for example","on the other hand","in contrast","by contrast","as a result","firstly","secondly","finally","in conclusion","to conclude","overall","whereas","while","although","despite","in spite of","thus","hence","similarly","likewise","conversely","that said","admittedly"];
const SUBORD=["although","because","since","while","whereas","unless","whether","if","when","after","before","though","which","who","whose","that","in order to","so that","given that","provided that","even though"];
const ACADEMIC=["significant","substantial","consequently","furthermore","implement","evidence","factor","impact","policy","research","approach","context","benefit","argue","suggest","demonstrate","alternative","consequence","establish","framework","perspective","phenomenon","principle","tendency","priority","invest","allocate","sustainable","detrimental","mitigate","exacerbate","prevalent","widespread","crucial","fundamental","proportion","majority","furthermore","moreover","arguably","inevitably","undoubtedly","nevertheless","circumstance","initiative","incentive","infrastructure","legislation","regulation","stakeholder","disparity","conversely"];
const ERRORS=[
  { re:/\bi\b/g, msg:"'i' must always be capitalised as 'I'." },
  { re:/\b(am|is|are|was|were)\s+agree\b/gi, msg:"Use 'I agree', not 'I am agree'." },
  { re:/\bdiscuss about\b/gi, msg:"'Discuss' takes no preposition: discuss the issue." },
  { re:/\bdepend of\b/gi, msg:"'Depend on', not 'depend of'." },
  { re:/\binformations\b/gi, msg:"'Information' is uncountable — no plural -s." },
  { re:/\badvices\b/gi, msg:"'Advice' is uncountable — no plural -s." },
  { re:/\bresearches\b/gi, msg:"'Research' is normally uncountable in academic writing." },
  { re:/\bpeoples\b/gi, msg:"'People' is already plural." },
  { re:/\bmore better\b|\bmost best\b/gi, msg:"Double comparative — use 'better' or 'the best'." },
  { re:/\bnowadays\s*,?\s*nowadays\b/gi, msg:"'Nowadays' repeated." },
  { re:/\bin nowadays\b/gi, msg:"Just 'nowadays', with no preposition." },
  { re:/\baccording to me\b/gi, msg:"Use 'in my view' — 'according to' introduces a source, not yourself." },
  { re:/\bmany informations?\b/gi, msg:"'Much information', not 'many information'." },
  { re:/\beveryday\b(?=\s+(i|we|they|people|students))/gi, msg:"'Every day' (two words) is the time phrase; 'everyday' is an adjective." },
  { re:/\bcan able to\b/gi, msg:"Use 'can' or 'be able to', not both." },
  { re:/\bthe most \w+est\b/gi, msg:"Double superlative." },
  { re:/\bconcern about\b(?=\s+(is|are))/gi, msg:"Consider 'concern regarding' or rephrase." },
  { re:/\bin other hand\b/gi, msg:"'On the other hand'." },
  { re:/\bas well as\s+that\b/gi, msg:"Prefer 'in addition' at the start of a sentence." },
  { re:/\bwe should to\b|\bmust to\b|\bshould to\b/gi, msg:"Modal verbs are followed by the bare infinitive: 'should do'." }
];
const wordCount=t=>(t.trim().match(/[A-Za-z'’-]+/g)||[]).length;

function analyzeWriting(text, o={}){
  const target=o.target||250, task=o.task||2;
  const raw=text||"";
  const words=(raw.match(/[A-Za-z'’-]+/g)||[]).map(w=>w.toLowerCase());
  const n=words.length;
  const sents=raw.split(/[.!?]+(?=\s|$)/).map(s=>s.trim()).filter(s=>s.length>1);
  const paras=raw.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  const low=" "+raw.toLowerCase()+" ";

  const uniq=new Set(words).size;
  const ttr = n? uniq/Math.sqrt(n*2) : 0;                 // length-corrected diversity
  const longW = n? words.filter(w=>w.length>=8).length/n : 0;
  const acad = ACADEMIC.filter(w=>low.includes(" "+w)).length;
  const coh  = COHESIVE.filter(w=>low.includes(" "+w)).length;
  const sub  = SUBORD.reduce((a,w)=>a+(low.split(" "+w+" ").length-1),0);
  const lens = sents.map(s=>(s.match(/[A-Za-z'’-]+/g)||[]).length).filter(x=>x>0);
  const avgLen = lens.length? lens.reduce((a,b)=>a+b,0)/lens.length : 0;
  const sd = lens.length>1 ? Math.sqrt(lens.reduce((a,b)=>a+(b-avgLen)**2,0)/lens.length) : 0;
  const freq={}; words.forEach(w=>{ if(w.length>4) freq[w]=(freq[w]||0)+1; });
  const topRep = Math.max(0,...Object.values(freq));

  const found=[];
  ERRORS.forEach(e=>{ const m=raw.match(e.re); if(m) found.push({ msg:e.msg, count:m.length, sample:m[0] }); });
  const errCount=found.reduce((a,e)=>a+e.count,0);
  const errRate = n? errCount/(n/100) : 0;                // errors per 100 words

  const notes=[];
  /* Task response */
  let tr=4;
  const cover=n/target;
  tr += cover>=1?2.4 : cover>=0.8?1.9 : cover>=0.6?1.3 : cover>=0.4?0.7 : 0;
  const hasView=/\b(i (believe|think|argue|would argue|maintain)|in my (view|opinion)|this essay (will )?argues?|my own view)\b/i.test(raw);
  const hasBoth=/\b(on the one hand|some (people )?(argue|believe|claim)|others (argue|believe|claim|contend)|proponents|critics)\b/i.test(raw);
  if(hasView) tr+=0.6; else notes.push({k:"Task response",t:"State your position explicitly. Examiners look for a clear thesis in the introduction and a matching restatement in the conclusion."});
  if(task===2 && hasBoth) tr+=0.4;
  if(paras.length>=4) tr+=0.5; else if(paras.length<=1) { tr-=0.6; notes.push({k:"Task response",t:"Your response is a single block. Use four or five clear paragraphs — introduction, two body paragraphs, conclusion."}); }
  if(n<target*0.75) notes.push({k:"Task response",t:`You wrote ${n} words against a target of ${target}. Under-length responses are penalised before content is even considered.`});

  /* Coherence and cohesion — variety of devices and referencing, not raw count.
     Band 7+ descriptors reward natural cohesion and penalise mechanical
     signposting, so sentence-initial linker density is scored downward.     */
  const distinctCoh = new Set(COHESIVE.filter(w=>low.includes(" "+w))).size;
  const refHits = (low.match(/\b(this|these|those|such|which|whose|they|their|its|the former|the latter)\b/g)||[]).length;
  const refDensity = n ? refHits/n : 0;
  const initialLinkers = sents.filter(x=>COHESIVE.some(w=>x.toLowerCase().startsWith(w))).length;
  const initRatio = sents.length ? initialLinkers/sents.length : 0;
  let cc=4;
  cc += paras.length>=4?1.7 : paras.length===3?1.2 : paras.length===2?0.6 : 0;
  cc += distinctCoh>=7?1.5 : distinctCoh>=5?1.2 : distinctCoh>=3?0.85 : distinctCoh>=1?0.4 : 0;
  cc += refDensity>=0.045?0.7 : refDensity>=0.028?0.45 : refDensity>=0.015?0.2 : 0;
  if(distinctCoh<=2) notes.push({k:"Coherence",t:"Very few linking devices. Aim for one signposting phrase per paragraph, and use reference words — this, such, the latter — to tie sentences together."});
  if(initRatio>0.40){ cc-=0.6; notes.push({k:"Coherence",t:`${initialLinkers} of ${sents.length} sentences open with a linking word. Band 7 asks for cohesion that does not draw attention to itself — carry meaning forward with reference words instead.`}); }
  if(refDensity<0.015) notes.push({k:"Coherence",t:"Each sentence restarts the topic. Refer back — 'this shortfall', 'such measures', 'the latter' — so paragraphs read as one argument."});

  /* Lexical resource — sophistication weighs more than raw diversity, because
     a short text always looks diverse.                                       */
  let lr=4;
  lr += ttr>=4.2?1.2 : ttr>=3.5?1.0 : ttr>=2.9?0.75 : ttr>=2.3?0.45 : 0.15;
  lr += acad>=10?1.8 : acad>=7?1.4 : acad>=4?0.95 : acad>=2?0.5 : 0;
  lr += longW>=0.17?0.8 : longW>=0.12?0.55 : longW>=0.08?0.3 : 0;
  if(topRep>=Math.max(5,n/22)){ lr-=0.5; const w=Object.keys(freq).find(k=>freq[k]===topRep);
    notes.push({k:"Vocabulary",t:`"${w}" appears ${topRep} times. Paraphrase it — repetition of content words holds Lexical Resource at band 6.`}); }
  if(acad<=1){ lr=Math.min(lr,6.0);
    notes.push({k:"Vocabulary",t:"The vocabulary is entirely general. Band 7 needs topic-precise choices — 'alleviate', 'detrimental', 'incentive' — used accurately rather than decoratively."}); }
  else if(acad<4) notes.push({k:"Vocabulary",t:"Few topic-precise or academic words. Swap general verbs (get, make, do) for precise ones (obtain, generate, undertake)."});

  /* Grammatical range and accuracy */
  let gra=4;
  gra += sd>=6?1.4 : sd>=4?1.1 : sd>=2.5?0.7 : 0.2;
  gra += sub>=10?1.5 : sub>=6?1.2 : sub>=3?0.8 : sub>=1?0.4 : 0;
  gra += avgLen>=15&&avgLen<=26?0.6 : avgLen>=11?0.3 : 0;
  gra -= errRate>=4?1.6 : errRate>=2.5?1.1 : errRate>=1.5?0.7 : errRate>=0.7?0.35 : 0;
  if(sub<3) notes.push({k:"Grammar",t:"Almost all sentences are simple. Band 7 needs a mix — relative clauses, concession with 'although', and at least one conditional."});
  if(errRate>=1.5) notes.push({k:"Grammar",t:`Roughly ${errRate.toFixed(1)} flagged errors per 100 words. Band 7 requires the majority of sentences to be error-free.`});
  if(avgLen>30) notes.push({k:"Grammar",t:"Sentences are very long on average. Long is not the same as complex — break some up for control."});

  /* A short response cannot evidence sustained range, so range-based criteria
     are held back until enough text exists to judge them.                    */
  if(n<80){ lr=Math.min(lr,6.0); gra=Math.min(gra,6.0); cc=Math.min(cc,6.0);
    notes.push({k:"Length",t:`At ${n} words there is not enough text to demonstrate range. The estimate below is held back accordingly.`}); }
  else if(n < target*0.55){ lr=Math.min(lr,7.0); gra=Math.min(gra,7.0); }

  const cap=x=>clamp(Math.round(x*2)/2, 3.5, 8.5);
  const bands={ tr:cap(tr), cc:cap(cc), lr:cap(lr), gra:cap(gra) };
  const overall=roundBand((bands.tr+bands.cc+bands.lr+bands.gra)/4);
  return { bands, overall, notes, errors:found.slice(0,6),
    stats:{ words:n, sentences:sents.length, paragraphs:paras.length, avgLen:Math.round(avgLen), variety:+sd.toFixed(1),
            diversity:+ttr.toFixed(2), academic:acad, cohesive:distinctCoh, complex:sub, errRate:+errRate.toFixed(1) } };
}

function writingReportCard(a){
  const names={tr:"Task response",cc:"Coherence & cohesion",lr:"Lexical resource",gra:"Grammar: range & accuracy"};
  return `<div class="card">
    <div class="card-head"><h3>Writing analysis</h3><span class="pill gold">est. ${fmtBand(a.overall)}</span></div>
    ${Object.entries(a.bands).map(([k,v])=>`<div style="margin-bottom:9px">
      <div class="rowwrap" style="justify-content:space-between"><span class="small">${names[k]}</span><span class="mono small">${fmtBand(v)}</span></div>
      <div class="bar" style="margin-top:4px"><i style="width:${v/9*100}%"></i></div></div>`).join("")}
    <div class="rowwrap" style="margin:12px 0 6px">
      ${[["words",a.stats.words],["complex clauses",a.stats.complex],["linkers",a.stats.cohesive],["errors/100w",a.stats.errRate]]
        .map(([k,v])=>`<span class="pill"><span class="mono">${v}</span> ${k}</span>`).join("")}
    </div>
    ${a.notes.length?`<div style="margin-top:10px">${a.notes.slice(0,4).map(nt=>`<div class="kv" style="display:block"><b class="tiny" style="color:var(--teal-deep)">${esc(nt.k)}</b><div class="small" style="margin-top:2px">${esc(nt.t)}</div></div>`).join("")}</div>`:""}
    ${a.errors.length?`<details style="margin-top:10px"><summary class="small" style="cursor:pointer;color:var(--teal-deep)"><b>${a.errors.length} pattern${a.errors.length===1?"":"s"} to fix</b></summary>
      <ul class="small" style="margin:8px 0 0;padding-left:18px">${a.errors.map(e=>`<li style="margin-bottom:5px">${esc(e.msg)} <span class="muted">(×${e.count})</span></li>`).join("")}</ul></details>`:""}
    <p class="tiny muted" style="margin-top:12px">This is a rule-based estimate produced on your device, designed to be conservative. A trained examiner remains the only source of an official band.</p>
  </div>`;
}
</script>
<script>
/* ============================================================================
   VIEWS — Today, Plan, Practice, Progress, Settings
   ============================================================================ */

function libraryChip(){
  const n=Content.items, src=Content.source;
  const label = src==="file" ? `${n.toLocaleString()} items loaded`
              : src==="cached" ? `${n.toLocaleString()} items (cached)`
              : `${n.toLocaleString()} built-in items`;
  return `<button class="pill ${src==="core"?"":"teal"}" onclick="go('settings')" title="Question library">📚 ${label}</button>`;
}
function libraryPanel(){
  const n=Content.items, src=Content.source, c=(BANK.meta&&BANK.meta.counts)||null;
  const rows = c ? Object.entries(c).map(([k,v])=>`<div class="kv"><span class="small">${esc(k.replace(/([A-Z])/g," $1").toLowerCase())}</span><span class="mono small">${v.toLocaleString()}</span></div>`).join("") : "";
  return `<div class="card rise">
    <div class="card-head"><h3>Question library</h3>
      <span class="pill ${src==="core"?"gold":"mint"}">${src==="file"?"Full pack":src==="cached"?"Cached pack":"Core only"}</span></div>
    <p class="small muted" style="margin-bottom:12px">
      ${src==="core"
        ? `Running on the <b>${n.toLocaleString()}</b> items built into this file. The full pack adds thousands more across four difficulty tiers.`
        : `<b>${n.toLocaleString()}</b> items available across four difficulty tiers.${src==="cached"?" Loaded from this browser's cache.":""}`}
    </p>
    ${src!=="file" ? `<div class="banner" style="margin:0 0 12px">
        <span>📦</span><div><b>To load the full library:</b> keep <span class="mono tiny">band-ascent-content.json</span> in the same folder as this page and open the page from a local server — or just pick the file below, and it will be remembered on this device.
        ${Content.error?`<div class="tiny muted" style="margin-top:6px">Automatic loading failed: ${esc(Content.error)}.</div>`:""}</div></div>`:""}
    <div class="rowwrap">
      <button class="btn sm" onclick="$('#packFile').click()">${src==="file"?"Replace content pack":"Load content pack"}</button>
      <input type="file" id="packFile" accept="application/json" class="hidden" onchange="loadPackFile(this)">
      ${src!=="core"?`<button class="btn ghost sm" onclick="forgetPack()">Use core bank only</button>`:""}
    </div>
    ${rows?`<details style="margin-top:12px"><summary class="small" style="cursor:pointer;color:var(--teal-deep)"><b>What is in the library</b></summary><div style="margin-top:8px">${rows}</div></details>`:""}
  </div>`;
}
function loadPackFile(input){
  const f=input.files[0]; if(!f) return;

function trendSVG(){
  const h=S.history.slice(-10);
  if(h.length<2) return `<div class="center" style="padding:26px 10px">
    <div style="font-size:1.9rem">📈</div>
    <p class="small muted" style="margin-top:8px">One data point is not a trend. Re-take the calibration test in about three weeks and this chart will show the movement.</p></div>`;
  const W=460,H=190,pad=32;
  const xs=(i)=>pad+i*(W-pad*2)/(h.length-1);
  const ys=(b)=>H-pad-((b-3)/6)*(H-pad*1.4);
  const pts=h.map((p,i)=>[xs(i),ys(p.band)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${pts.at(-1)[0].toFixed(1)} ${H-pad} L ${pad} ${H-pad} Z`;
  const ty=ys(S.user.target);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Band history chart">
    ${[4,5,6,7,8,9].map(b=>`<line x1="${pad}" y1="${ys(b)}" x2="${W-pad}" y2="${ys(b)}" stroke="var(--line)" stroke-width="1"/>
      <text x="6" y="${ys(b)+4}" font-size="10" font-family="JetBrains Mono,monospace" fill="var(--faint)">${b}.0</text>`).join("")}
    <line x1="${pad}" y1="${ty}" x2="${W-pad}" y2="${ty}" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="${W-pad}" y="${ty-6}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="var(--gold-deep)">target ${fmtBand(S.user.target)}</text>
    <path d="${area}" fill="var(--teal-soft)" opacity=".7"/>
    <path d="${line}" fill="none" stroke="var(--teal)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="#fff" stroke="var(--teal)" stroke-width="2.4"/>
      <text x="${p[0].toFixed(1)}" y="${(p[1]-12).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" font-family="JetBrains Mono,monospace" fill="var(--ink)">${fmtBand(h[i].band)}</text>`).join("")}
  </svg>`;
}

function radarSVG(){
  const ax=[["L","listening"],["R","reading"],["W","writing"],["S","speaking"],["G","grammar"],["V","vocab"]];
  const cx=140,cy=132,R=96;
  const pt=(i,r)=>{const a=(i/ax.length)*Math.PI*2-Math.PI/2; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  const ring=f=>ax.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(",")).join(" ");
  const val=ax.map(([,k],i)=>pt(i,R*clamp((S.bands[k]||0)/9,0,1)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const tgt=ring(clamp(S.user.target/9,0,1));
  return `<svg viewBox="0 0 280 250" width="100%" role="img" aria-label="Skill balance radar">
    ${[0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("")}
    ${ax.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;}).join("")}
    <polygon points="${tgt}" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="4 3"/>
    <polygon points="${val}" fill="var(--teal)" fill-opacity=".22" stroke="var(--teal)" stroke-width="2.4" stroke-linejoin="round"/>
    ${ax.map(([lab,k],i)=>{const [x,y]=pt(i,R+18);return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" font-family="JetBrains Mono,monospace" fill="var(--muted)">${lab}</text>`;}).join("")}
    ${ax.map(([,k],i)=>{const [x,y]=pt(i,R*clamp((S.bands[k]||0)/9,0,1));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="var(--teal)"/>`;}).join("")}
  </svg>`;
}

function heatSVG(){
  const cells=[]; const today=new Date();
  const start=new Date(today); start.setDate(start.getDate()-90);
  start.setDate(start.getDate()-start.getDay());
  for(let i=0;i<98;i++){
    const dt=new Date(start); dt.setDate(dt.getDate()+i);
    if(dt>today){ cells.push(null); continue; }
    const k=dt.toISOString().slice(0,10), d=S.days[k];
    const xp=d?d.xp:0;
    cells.push({k, l: xp===0?0: xp<50?1: xp<120?2: xp<250?3:4, xp});
  }
  return `<div class="heat" style="min-width:${Math.ceil(98/7)*15}px">
    ${cells.map(c=>c?`<i data-l="${c.l}" title="${c.k}: ${c.xp} XP"></i>`:`<i style="opacity:.25"></i>`).join("")}
  </div>
  <div class="rowwrap" style="margin-top:10px;justify-content:flex-end">
    <span class="tiny muted">less</span>
    ${[0,1,2,3,4].map(l=>`<i style="width:12px;height:12px;border-radius:3px;display:block;background:${["var(--paper-2)","#BFE4E7","#79C9CF","#2C939C","var(--teal-deep)"][l]}"></i>`).join("")}
    <span class="tiny muted">more</span>
  </div>`;
}

function saveSettings(){
  S.user.name=$("#stName").value.trim();
  S.user.target=parseFloat($("#stTarget").value);
  S.user.examDate=$("#stDate").value;
  S.user.dailyMinutes=parseInt($("#stMins").value,10);
  if(S.assessed) S.plan=buildPlan();
  save(); toast("Saved","Your plan has been rebuilt around the new target.","✅"); renderSettings();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`band-ascent-backup-${todayKey()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup saved","Keep the file somewhere safe — it restores everything.","💾");
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d||typeof d!=="object"||!("xp" in d)) throw 0;
      S=Object.assign(blank(),d); save();
      toast("Backup restored","Your history is back.","✅"); go("home");
    }catch(e){ toast("Could not read that file","The backup must be a JSON file exported from Band Ascent.","⚠️"); } };
  r.readAsText(f);
}
function resetAll(){
  modal(`<h2>Erase everything?</h2>
    <p class="muted" style="margin:10px 0 18px">Your band history, XP, streak and badges will be deleted from this device. This cannot be undone.</p>
    <div class="rowwrap" style="justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Keep my data</button>
      <button class="btn danger" onclick="Store.del(KEY);location.reload()">Erase everything</button>
    </div>`);
}
</script>
<script>
/* ============================================================================
   PRACTICE DRILLS
   ============================================================================ */
let G=null;
/* tier filter for nested arrays (speaking cards, writing prompts) */
function poolOf2(all, want, min){
  if(!all || !all.length) return [];
  want = want || tierFor(); min = min || 4;
  const i=Math.max(0,TIER_ORDER.indexOf(want));
  let sel=all.filter(x=>x.tier===want);
  for(let step=1; sel.length<min && step<4; step++){
    const lo=TIER_ORDER[i-step], hi=TIER_ORDER[i+step];
    sel=sel.concat(all.filter(x=>x.tier===lo||x.tier===hi));
  }
  return sel.length?sel:all;
}

function openGame(id){ go("play"); G={id, started:Date.now()}; ({
  rush:playRush, colloc:playColloc, para:playPara, forge:playForge,
  gap:playGap, dictation:playDictation, skim:playSkim, write:playWrite, speak:playSpeak
}[id])(); }

function shell(inner, opts={}){
  const m=GAME_META[G.id];
  $("#view-play").innerHTML=`
  <div class="topbar">
    <div class="rowwrap">
      <button class="btn ghost sm" onclick="quitGame()">← Back</button>
      <div><div class="eyebrow">${esc(m.s)} · ${esc(TIER_LABEL[tierFor()])}</div><h2 style="margin-top:2px">${m.i} ${esc(m.n)}</h2></div>
    </div>
    <div class="rowwrap" id="hud">${opts.hud||""}</div>
  </div>
  <div id="gameBody">${inner}</div>`;
}
function hud(html){ const h=$("#hud"); if(h) h.innerHTML=html; }
function quitGame(){ Speech.stop(); stopAllTimers(); if(window.SR&&SR.stop) try{SR.stop()}catch(e){}; go("arena"); }

function endGame(score, xp, summaryHTML, opts={}){
  stopAllTimers(); Speech.stop();
  const mins=Math.max(1,Math.round((Date.now()-G.started)/60000));
  const prev=S.bests[G.id];
  const isBest = prev===undefined || score>prev;
  if(isBest) S.bests[G.id]=score;
  addXP(xp, GAME_META[G.id].n);
  logSession(G.id, `${GAME_META[G.id].n} — ${opts.line||("score "+score)}`, xp, mins);
  completeQuest(G.id);
  if(opts.perfect) grant("perfect");
  if(G.id==="rush"&&score>=50) grant("rush50");
  save(); checkBadges();
  if(isBest && prev!==undefined) try{celebrate();}catch(e){}
  $("#view-play").innerHTML=`
  <div class="stage rise" style="max-width:620px;margin:clamp(6px,4vh,50px) auto 0;text-align:center">
    <div style="font-size:2.6rem">${opts.ico||"🏁"}</div>
    <h2 style="margin:10px 0 4px">${esc(opts.title||"Drill complete")}</h2>
    <p class="small muted">${esc(opts.sub||GAME_META[G.id].n)}</p>
    <div class="grid g3" style="gap:12px;margin:20px 0">
      <div class="stat"><div class="stat-v">${score}</div><div class="stat-k">Score</div></div>
      <div class="stat"><div class="stat-v">+${xp}</div><div class="stat-k">XP earned</div></div>
      <div class="stat"><div class="stat-v">${S.bests[G.id]}</div><div class="stat-k">Personal best</div></div>
    </div>
    ${isBest&&prev!==undefined?`<div class="banner" style="justify-content:center"><span>🏆</span><div>New personal best, beating ${prev}.</div></div>`:""}
    <div style="text-align:left">${summaryHTML||""}</div>
    <div class="rowwrap" style="justify-content:center;margin-top:20px">
      <button class="btn gold" onclick="openGame('${G.id}')">Play again</button>
      <button class="btn ghost" onclick="go('arena')">Other drills</button>
      <button class="btn ghost" onclick="go('home')">Today</button>
    </div>
  </div>`;
  paintChrome();
}

/* ---------------------------------------------------------- 1. WORD RUSH */
function playRush(){
  let left=60, score=0, combo=0, best=0, asked=0, wrong=[];
  const pool=shuffle(poolOf("wordRush"));
  shell(`<div class="stage" style="max-width:640px;margin:0 auto"><div id="rq"></div></div>`);
  const paint=()=>hud(`<span class="timer" id="rt">0:60</span><span class="pill gold">score <span class="mono">${score}</span></span><span class="pill">combo <span class="combo">×${1+Math.floor(combo/3)}</span></span>`);
  paint();
  every(()=>{ left--; const t=$("#rt"); if(!t) return;
    t.textContent=`0:${String(left).padStart(2,"0")}`; t.classList.toggle("warn",left<=10);
    if(left<=0) finish();
  },1000);
  next();
  function next(){
    const it=pool[asked%pool.length]; asked++;
    const opts=shuffle([{t:it.d,ok:true},...it.x.map(x=>({t:x,ok:false}))]);
    $("#rq").innerHTML=`<div class="center" style="margin-bottom:18px">
        <div class="eyebrow">what does this mean?</div>
        <div style="font-family:var(--f-disp);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);margin-top:6px">${esc(it.w)}</div></div>
      <div id="ro">${opts.map((o,i)=>`<button class="opt" data-ok="${o.ok}"><span class="key">${"ABCD"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
    $$("#ro .opt").forEach(b=>b.onclick=e=>{
      const ok=b.dataset.ok==="true";
      $$("#ro .opt").forEach(x=>{x.classList.add("locked"); if(x.dataset.ok==="true")x.classList.add("ok");});
      if(ok){ combo++; best=Math.max(best,combo); score+=1+Math.floor(combo/3); }
      else { b.classList.add("no"); combo=0; wrong.push(it); }
      paint(); later(next, ok?280:900);
    });
  }
  function finish(){
    endGame(score, score*3+10,
      wrong.length?`<div class="card tight"><div class="eyebrow" style="margin-bottom:8px">Review these</div>
        ${[...new Set(wrong)].slice(0,8).map(w=>`<div class="kv"><b class="small">${esc(w.w)}</b><span class="small muted" style="text-align:right;flex:1">${esc(w.d)}</span></div>`).join("")}</div>`
      :`<div class="banner" style="justify-content:center"><span>💎</span><div>Not one wrong. Add these to a spaced-repetition list so they stay.</div></div>`,
      { ico:"💨", title:`${score} points`, sub:`Best combo ×${1+Math.floor(best/3)} · ${asked-1} words seen`, perfect:wrong.length===0&&asked>8, line:`${score} points` });
  }
}

/* --------------------------------------------------- 2. COLLOCATION LOCK */
function playColloc(){
  const set=shuffle(poolOf("collocations")).slice(0,8);
  let picked=null, matched=0, misses=0, t=0;
  const L=shuffle(set.map((p,i)=>({t:p.a,i}))), R=shuffle(set.map((p,i)=>({t:p.b2,i})));
  shell(`<div class="stage" style="max-width:700px;margin:0 auto">
    <p class="small muted center" style="margin-bottom:18px">Lock each word on the left to the word it naturally goes with on the right.</p>
    <div class="grid g2" style="gap:14px">
      <div id="colL">${L.map(x=>`<button class="tile wide" data-side="L" data-i="${x.i}" style="width:100%;margin-bottom:8px;text-align:left">${esc(x.t)}</button>`).join("")}</div>
      <div id="colR">${R.map(x=>`<button class="tile wide" data-side="R" data-i="${x.i}" style="width:100%;margin-bottom:8px;text-align:left">${esc(x.t)}</button>`).join("")}</div>
    </div></div>`);
  const paint=()=>hud(`<span class="timer" id="ct">0:00</span><span class="pill mint">locked <span class="mono">${matched}/8</span></span><span class="pill coral">misses <span class="mono">${misses}</span></span>`);
  paint(); every(()=>{ t++; const e=$("#ct"); if(e) e.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`; },1000);
  $$("#colL .tile, #colR .tile").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("gone")) return;
    if(!picked){ picked=b; b.classList.add("sel"); return; }
    if(picked===b){ b.classList.remove("sel"); picked=null; return; }
    if(picked.dataset.side===b.dataset.side){ picked.classList.remove("sel"); picked=b; b.classList.add("sel"); return; }
    if(picked.dataset.i===b.dataset.i){
      [picked,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");later(()=>x.classList.add("gone"),400);});
      matched++; picked=null; paint();
      if(matched===8){ later(()=>{
        const score=Math.max(0,matched*10-misses*3);
        endGame(score, score*2+20, `<div class="card tight"><div class="eyebrow" style="margin-bottom:8px">The eight pairs</div>
          ${set.map(p=>`<div class="kv"><span class="small"><b>${esc(p.a)}</b> ${esc(p.b2)}</span></div>`).join("")}</div>`,
          { ico:"🔗", title:"All locked", sub:`${t} seconds · ${misses} misses`, perfect:misses===0, line:`8 pairs, ${misses} misses` });
      },500); }
    } else {
      misses++; b.classList.add("no"); picked.classList.remove("sel");
      const p=picked; picked=null; later(()=>{b.classList.remove("no");},350); paint();
    }
  });
}

/* -------------------------------------------------- 3. PARAPHRASE SPRINT */
function playPara(){
  const set=shuffle(poolOf("paraphrase")).slice(0,8);
  let i=0, score=0, wrong=[];
  shell(`<div class="stage" style="max-width:680px;margin:0 auto"><div id="pq"></div></div>`);
  const paint=()=>hud(`<div class="ticker">${set.map((_,k)=>`<i class="${k<i?"on":k===i?"now":""}"></i>`).join("")}</div><span class="pill gold">score <span class="mono">${score}</span></span>`);
  next();
  function next(){
    paint();
    if(i>=set.length) return finish();
    const it=set[i];
    const opts=it.opts.map((t,k)=>({t,ok:k===it.a}));
    $("#pq").innerHTML=`<div class="eyebrow">original</div>
      <div class="passage" style="max-height:none;margin:8px 0 18px;font-size:1.02rem">${esc(it.s)}</div>
      <h3 style="margin-bottom:12px;font-size:1rem">Which sentence keeps the meaning but changes the wording?</h3>
      <div id="po">${opts.map((o,k)=>`<button class="opt" data-ok="${o.ok}"><span class="key">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
    $$("#po .opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.ok==="true";
      $$("#po .opt").forEach(x=>{x.classList.add("locked"); if(x.dataset.ok==="true")x.classList.add("ok");});
      if(ok) score+=10; else { b.classList.add("no"); wrong.push(it); }
      i++; later(next, ok?900:1900);
    });
  }
  function finish(){
    endGame(score, score*2+15,
      wrong.length?`<div class="card tight"><div class="eyebrow" style="margin-bottom:8px">Look again at these</div>
        ${wrong.map(w=>`<div style="margin-bottom:10px"><div class="small">${esc(w.s)}</div><div class="small" style="color:var(--teal-deep)">→ ${esc(w.ok)}</div></div>`).join("")}</div>`
      :`<div class="banner" style="justify-content:center"><span>💎</span><div>Every one right. Paraphrase is the single most transferable IELTS skill.</div></div>`,
      { ico:"🔀", title:`${score} points`, sub:`${set.length-wrong.length} of ${set.length} correct`, perfect:wrong.length===0, line:`${set.length-wrong.length}/${set.length}` });
  }
}

/* ------------------------------------------------------ 4. SENTENCE FORGE */
function playForge(){
  const set=shuffle(poolOf("forge")).slice(0,5);
  let i=0, score=0, built=[];
  shell(`<div class="stage" style="max-width:700px;margin:0 auto"><div id="fq"></div></div>`);
  next();
  function next(){
    hud(`<div class="ticker">${set.map((_,k)=>`<i class="${k<i?"on":k===i?"now":""}"></i>`).join("")}</div><span class="pill gold">score <span class="mono">${score}</span></span>`);
    if(i>=set.length) return finish();
    const it=set[i]; const bank=shuffle(it.words.map((w,k)=>({w,k})));
    built=[];
    $("#fq").innerHTML=`<div class="eyebrow">${esc(it.note)}</div>
      <h3 style="margin:8px 0 14px;font-size:1rem">Put the words in order to build one grammatical sentence.</h3>
      <div class="slot" id="slot" aria-label="Your sentence"></div>
      <div class="rowwrap" id="bank" style="margin-top:14px">${bank.map(b=>`<button class="tile" data-k="${b.k}">${esc(b.w)}</button>`).join("")}</div>
      <div class="rowwrap" style="margin-top:16px;justify-content:space-between">
        <button class="btn ghost sm" onclick="forgeUndo()">Undo</button>
        <button class="btn" id="fcheck">Check sentence</button>
      </div>
      <div id="fres" class="hidden small" style="margin-top:12px;padding:12px;border-radius:12px"></div>`;
    $$("#bank .tile").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("gone")) return;
      b.classList.add("gone"); built.push({k:+b.dataset.k, w:b.textContent, el:b});
      drawSlot();
    });
    $("#fcheck").onclick=check;
    window.forgeUndo=()=>{ const last=built.pop(); if(last){ last.el.classList.remove("gone"); drawSlot(); } };
    function drawSlot(){ $("#slot").innerHTML=built.map(b=>`<span class="tile" style="pointer-events:none">${esc(b.w)}</span>`).join(""); }
    function check(){
      const guess=built.map(b=>b.w), target=it.words;
      const okAll = guess.length===target.length && guess.every((w,k)=>w===target[k]);
      const res=$("#fres"); res.classList.remove("hidden");
      if(okAll){ score+=20; res.style.background="var(--mint-soft)"; res.innerHTML=`<b>Correct.</b> ${esc(it.note)}.`; }
      else { res.style.background="var(--coral-soft)";
        res.innerHTML=`<b>Not quite.</b> The intended sentence was:<br><span style="color:var(--ink)">${esc(target.join(" ").replace(/ ([,.])/g,"$1"))}</span>`; }
      $("#fcheck").disabled=true;
      i++; later(next, okAll?1300:3200);
    }
  }
  function finish(){
    endGame(score, score*2+15, `<div class="card tight"><div class="eyebrow" style="margin-bottom:8px">Structures practised</div>
      ${set.map(s=>`<div class="kv"><span class="small">${esc(s.note)}</span></div>`).join("")}</div>`,
      { ico:"🔨", title:`${score} points`, sub:`${score/20} of ${set.length} built correctly`, perfect:score===set.length*20, line:`${score/20}/${set.length}` });
  }
}

/* ---------------------------------------------------------- 5. GAP RUNNER */
function playGap(){
  const set=shuffle(poolOf("gap")).slice(0,12);
  let i=0, lives=3, score=0, wrong=[];
  shell(`<div class="stage" style="max-width:640px;margin:0 auto"><div id="gq"></div></div>`);
  next();
  function next(){
    hud(`<div class="lives">${[0,1,2].map(k=>`<i class="${k<lives?"":"off"}"></i>`).join("")}</div><span class="pill gold">score <span class="mono">${score}</span></span><span class="tiny mono muted">${i+1}/${set.length}</span>`);
    if(i>=set.length || lives<=0) return finish();
    const it=set[i];
    $("#gq").innerHTML=`<h3 style="font-size:1.15rem;margin-bottom:18px;line-height:1.6">${esc(it.s).replace("___",'<span style="color:var(--gold);font-weight:800">______</span>')}</h3>
      <div id="go">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    $$("#go .opt").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===it.a;
      $$("#go .opt").forEach(x=>{x.classList.add("locked"); if(+x.dataset.k===it.a)x.classList.add("ok");});
      if(ok) score+=10; else { b.classList.add("no"); lives--; wrong.push(it); }
      i++; later(next, ok?650:1700);
    });
  }
  function finish(){
    endGame(score, score*2+10,
      wrong.length?`<div class="card tight"><div class="eyebrow" style="margin-bottom:8px">Gaps you missed</div>
        ${wrong.map(w=>`<div class="kv"><span class="small">${esc(w.s).replace("___",`<b style="color:var(--teal-deep)">${esc(w.opts[w.a])}</b>`)}</span></div>`).join("")}</div>`
      :`<div class="banner" style="justify-content:center"><span>💎</span><div>Twelve gaps, three lives intact.</div></div>`,
      { ico: lives>0?"🕳️":"💀", title: lives>0?`${score} points`:"Out of lives",
        sub:`${wrong.length} wrong · ${lives} lives left`, perfect:wrong.length===0, line:`${score} pts, ${lives} lives` });
  }
}

/* ------------------------------------------------------ 6. ECHO DICTATION */
function playDictation(){
  const set=shuffle(poolOf("dictation")).slice(0,6);
  let i=0, total=0, rows=[];
  shell(`<div class="stage" style="max-width:660px;margin:0 auto"><div id="dq"></div></div>`);
  if(!Speech.ok){
    $("#dq").innerHTML=`<div class="banner"><span>🔇</span><div>This browser has no speech engine, so dictation cannot run. Try Chrome, Edge or Safari — or use Skim & Scan for reading practice instead.</div></div>
      <button class="btn wide" onclick="go('arena')">Back to drills</button>`; return;
  }
  next();
  function next(){
    hud(`<div class="ticker">${set.map((_,k)=>`<i class="${k<i?"on":k===i?"now":""}"></i>`).join("")}</div><span class="pill gold">accuracy <span class="mono">${i?Math.round(total/i)+"%":"—"}</span></span>`);
    if(i>=set.length) return finish();
    const s=set[i].s; let plays=0;
    $("#dq").innerHTML=`<p class="small muted center" style="margin-bottom:16px">Listen, then type exactly what you heard. Two plays, normal speed then slow.</p>
      <div class="center" style="margin-bottom:18px">
        <button class="btn gold" id="dplay">▶ Play sentence</button>
        <div class="tiny mono muted" id="dinfo" style="margin-top:8px">2 plays available</div>
      </div>
      <textarea class="write" id="dtext" style="min-height:90px" placeholder="Type what you hear…" aria-label="Dictation answer"></textarea>
      <button class="btn wide" style="margin-top:12px" id="dcheck">Check</button>
      <div id="dres" class="hidden small" style="margin-top:12px;padding:13px;border-radius:12px"></div>`;
    const play=()=>{ if(plays>=2) return; plays++; const b=$("#dplay"); b.disabled=true; b.textContent="◼ Playing…";
      $("#dinfo").textContent=`${2-plays} play${2-plays===1?"":"s"} left`;
      Speech.say(s, plays===1?0.95:0.78, ()=>{ b.disabled=plays>=2; b.textContent=plays>=2?"No plays left":"▶ Play slower"; }); };
    $("#dplay").onclick=play; later(play,400);
    $("#dtext").focus();
    $("#dcheck").onclick=()=>{
      const acc=Math.round(similarity($("#dtext").value, s)*100);
      total+=acc; rows.push({s, got:$("#dtext").value, acc});
      const r=$("#dres"); r.classList.remove("hidden");
      r.style.background = acc>=90?"var(--mint-soft)":acc>=65?"var(--gold-soft)":"var(--coral-soft)";
      r.innerHTML=`<b>${acc}% accurate.</b><br><span class="muted">Original:</span> ${esc(s)}`;
      $("#dcheck").disabled=true; Speech.stop();
      i++; later(next, 2600);
    };
  }
  function finish(){
    const avg=Math.round(total/set.length);
    endGame(avg, Math.round(avg*1.2)+10,
      `<div class="card tight"><div class="eyebrow" style="margin-bottom:8px">Sentence by sentence</div>
        ${rows.map(r=>`<div class="kv"><span class="small" style="flex:1">${esc(r.s)}</span><span class="pill ${r.acc>=90?"mint":r.acc>=65?"gold":"coral"} mono">${r.acc}%</span></div>`).join("")}</div>
       <p class="small muted" style="margin-top:10px">Dictation trains the exact skill Listening Part 4 tests: holding a phrase in memory long enough to write it accurately. Spelling counts in the real test.</p>`,
      { ico:"🎧", title:`${avg}% average accuracy`, sub:`${set.length} sentences`, perfect:avg===100, line:`${avg}% accuracy` });
  }
}
function similarity(a,b){
  const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  const A=norm(a), B=norm(b);
  if(!B.length) return 0;
  const d=Array.from({length:A.length+1},(_,i)=>Array.from({length:B.length+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=A.length;i++) for(let j=1;j<=B.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));
  return clamp(1 - d[A.length][B.length]/Math.max(A.length,B.length), 0, 1);
}

/* ---------------------------------------------------------- 7. SKIM & SCAN */
function playSkim(){
  const p=pick(poolOf("skim",null,1));
  const st=shuffle(p.st);
  let i=0, score=0, left=100, wrong=[];
  const labels=["True","False","Not given"];
  shell(`<div class="stage" style="max-width:760px;margin:0 auto">
    <div class="passage" style="margin-bottom:18px">${esc(p.text)}</div>
    <div id="sq"></div></div>`);
  every(()=>{ left--; const t=$("#st"); if(!t) return;
    t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; t.classList.toggle("warn",left<=20);
    if(left<=0) finish();
  },1000);
  next();
  function next(){
    hud(`<span class="timer" id="st">1:40</span><span class="pill gold">score <span class="mono">${score}</span></span><span class="tiny mono muted">${Math.min(i+1,st.length)}/${st.length}</span>`);
    if(i>=st.length) return finish();
    const q=st[i];
    $("#sq").innerHTML=`<h3 style="font-size:1.05rem;margin-bottom:14px">${esc(q.s)}</h3>
      <div class="rowwrap" id="so">${labels.map((l,k)=>`<button class="tile" data-k="${k}" style="flex:1;min-width:100px">${l}</button>`).join("")}</div>
      <div id="sres" class="hidden small" style="margin-top:12px;padding:12px;border-radius:12px;background:var(--gold-soft)"></div>`;
    $$("#so .tile").forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===q.a;
      $$("#so .tile").forEach(x=>{x.style.pointerEvents="none"; if(+x.dataset.k===q.a)x.classList.add("ok");});
      if(ok) score+=10; else { b.classList.add("no"); wrong.push(q); }
      const r=$("#sres"); r.classList.remove("hidden");
      r.innerHTML= ok?"<b>Correct.</b>":`<b>Answer: ${labels[q.a]}.</b> ${q.a===2?"'Not given' means the passage neither confirms nor contradicts it — do not use outside knowledge.":"Find the sentence in the passage that decides it."}`;
      i++; later(next, ok?800:2200);
    });
  }
  function finish(){
    endGame(score, score*2+10,
      `<p class="small muted">True / False / Not Given punishes inference. If you had to reason two steps to reach the answer, it is almost always Not Given.</p>`,
      { ico:"🔍", title:`${score} points`, sub:`${st.length-wrong.length} of ${st.length} correct`, perfect:wrong.length===0, line:`${st.length-wrong.length}/${st.length}` });
  }
}

/* ---------------------------------------------------------- 8. WRITING LAB */
function playWrite(){
  shell(`<div class="stage" style="max-width:760px;margin:0 auto">
    <h3 style="margin-bottom:6px">Choose a task</h3>
    <p class="small muted" style="margin-bottom:16px">Task 1 is 150 words in 20 minutes. Task 2 is 250 words in 40 minutes and carries twice the weight.</p>
    <div class="seg" style="margin-bottom:16px">
      <button class="on" onclick="wSwitch(2,this)">Task 2 — essay</button>
      <button onclick="wSwitch(1,this)">Task 1 — report</button>
    </div>
    <div id="wlist"></div></div>`);
  window.wSwitch=(t,btn)=>{ $$(".seg button").forEach(b=>b.classList.toggle("on",b===btn)); listPrompts(t); };
  listPrompts(2);
  function listPrompts(t){
    const arr = poolOf2(t===2?BANK.writing.task2:BANK.writing.task1, null, 3);
    $("#wlist").innerHTML=arr.map((p,i)=>`<button class="task" style="width:100%;margin-bottom:9px;text-align:left" onclick="beginWrite(${t},${i})">
      <div class="task-ico">${t===2?"📝":"📊"}</div>
      <div style="flex:1"><div class="tiny eyebrow">${esc(p.tag)}</div><div class="small" style="margin-top:3px">${esc(p.p.split("\n")[0].slice(0,110))}${p.p.length>110?"…":""}</div></div>
      <span class="tiny mono muted">${t===2?"40":"20"} min</span></button>`).join("");
  }
}
function beginWrite(task, idx){
  const item = task===2?BANK.writing.task2[idx]:BANK.writing.task1[idx];
  const mins = task===2?40:20, target=task===2?250:150;
  let left=mins*60, running=true;
  shell(`<div class="stage" style="max-width:800px;margin:0 auto">
    <div class="qmeta"><span class="pill teal">Task ${task} · ${esc(item.tag)}</span><span class="timer" id="wt">${String(mins).padStart(2,"0")}:00</span></div>
    <div class="passage" style="max-height:none;margin-bottom:14px;white-space:pre-wrap">${esc(item.p)}</div>
    <textarea class="write" id="wtx" style="min-height:300px" placeholder="Plan for two minutes, then write. Do not stop to edit."></textarea>
    <div class="rowwrap" style="justify-content:space-between;margin-top:12px">
      <span class="mono small" id="wc">0 / ${target} words</span>
      <div class="rowwrap">
        <button class="btn ghost sm" onclick="go('arena')">Abandon</button>
        <button class="btn gold" id="wgo">Analyse my response</button>
      </div>
    </div></div>`);
  const ta=$("#wtx");
  ta.oninput=()=>{ const n=wordCount(ta.value); const c=$("#wc");
    c.textContent=`${n} / ${target} words`; c.style.color=n>=target?"var(--mint)":n>=target*0.8?"var(--gold-deep)":"var(--muted)"; };
  every(()=>{ if(!running) return; left--;
    const el=$("#wt"); if(!el) return;
    el.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
    el.classList.toggle("warn",left<=120);
    if(left<=0){ running=false; toast("Time is up","Analysing what you have written.","⏱️"); done(); }
  },1000);
  $("#wgo").onclick=done;
  function done(){
    const txt=ta.value;
    if(wordCount(txt)<50){ toast("Too short to analyse","Write at least 50 words.","✍️"); return; }
    stopAllTimers();
    const a=analyzeWriting(txt,{task,target,minutes:mins});
    S.writings.unshift({ t:Date.now(), prompt:item.p.split("\n")[0], task, words:a.stats.words, overall:a.overall, bands:a.bands });
    S.writings=S.writings.slice(0,40);
    /* blend the new estimate into the tracked writing band */
    S.bands.writing = roundBand((S.bands.writing||a.overall)*0.6 + a.overall*0.4);
    save();
    const xp=Math.round(a.overall*14)+Math.min(40,Math.round(a.stats.words/10));
    endGame(Math.round(a.overall*10)/10, xp,
      writingReportCard(a)+`<div class="card tight" style="margin-top:14px">
        <div class="eyebrow" style="margin-bottom:8px">Your text</div>
        <div class="small" style="white-space:pre-wrap;max-height:220px;overflow-y:auto">${esc(txt)}</div></div>
      <p class="small muted" style="margin-top:12px"><b>Next step:</b> do not rewrite the whole essay. Take the single weakest criterion above and rewrite one paragraph addressing only that.</p>`,
      { ico:"✍️", title:`Estimated band ${fmtBand(a.overall)}`, sub:`${a.stats.words} words · ${a.stats.paragraphs} paragraphs`, line:`Task ${task}, est. ${fmtBand(a.overall)}` });
  }
}

/* --------------------------------------------------------- 9. SPEAKING LAB */
function playSpeak(){
  shell(`<div class="stage" style="max-width:720px;margin:0 auto">
    <h3 style="margin-bottom:6px">Choose a part</h3>
    <p class="small muted" style="margin-bottom:16px">Part 2 is the one that separates bands. One minute to plan, two minutes to speak, no interruption.</p>
    <div class="grid" style="gap:10px">
      <button class="task" onclick="beginSpeak(1)"><div class="task-ico">💬</div><div style="flex:1;text-align:left">
        <div class="task-title">Part 1 — Introduction</div><div class="tiny muted">Short personal questions, 30 seconds each</div></div><span class="tiny mono muted">4 min</span></button>
      <button class="task" onclick="beginSpeak(2)"><div class="task-ico">🗂️</div><div style="flex:1;text-align:left">
        <div class="task-title">Part 2 — Long turn</div><div class="tiny muted">Cue card, 1 min prep, 2 min talk</div></div><span class="tiny mono muted">3 min</span></button>
      <button class="task" onclick="beginSpeak(3)"><div class="task-ico">🧠</div><div style="flex:1;text-align:left">
        <div class="task-title">Part 3 — Discussion</div><div class="tiny muted">Abstract follow-ups, 45 seconds each</div></div><span class="tiny mono muted">4 min</span></button>
    </div>
    ${(window.SpeechRecognition||window.webkitSpeechRecognition)?"":`<div class="banner" style="margin-top:16px"><span>🎙️</span><div>Live transcription is not available in this browser, so the timer and self-review will be used instead. Chrome and Edge support transcription.</div></div>`}
  </div>`);
}
let SR=null;
function beginSpeak(part){
  const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
  const card = part===2?pick(poolOf2(BANK.speaking.p2)):null;
  const qs   = part===1?shuffle(BANK.speaking.p1).slice(0,4):part===3?shuffle(BANK.speaking.p3).slice(0,3):null;
  let phase = part===2?"prep":"talk", left=part===2?60:0, qi=0, transcript="", started=null;
  const talkSecs = part===2?120:part===1?30:45;

  paint();
  function paint(){
    const cueHTML = part===2
      ? `<div class="passage" style="max-height:none">
           <b>${esc(card.title)}</b>
           <p class="small" style="margin:8px 0 6px">You should say:</p>
           <ul style="margin:0 0 8px 18px" class="small">${card.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
           <p class="small">${esc(card.follow)}</p></div>`
      : `<div class="passage" style="max-height:none"><b>${esc(qs[qi])}</b>
           <p class="tiny muted" style="margin-top:8px">Question ${qi+1} of ${qs.length}</p></div>`;
    shell(`<div class="stage" style="max-width:700px;margin:0 auto">
      <div class="qmeta"><span class="pill teal">Part ${part}</span><span class="timer" id="spt">--:--</span></div>
      ${cueHTML}
      <div class="center" style="margin:20px 0">
        <button class="btn gold" id="spBtn">${phase==="prep"?"Start 1-minute preparation":"Start speaking"}</button>
        <div class="tiny muted" style="margin-top:8px" id="spHint">${phase==="prep"?"Make notes on paper. The timer runs for 60 seconds.":`Speak continuously for ${talkSecs} seconds.`}</div>
      </div>
      <div id="spLive" class="hidden">
        <div class="eyebrow" style="margin-bottom:6px">Live transcript</div>
        <div class="passage" id="spText" style="max-height:170px;min-height:70px"></div>
      </div>
      <div id="spOut"></div>
    </div>`);
    $("#spBtn").onclick=start;
  }
  function start(){
    const secs = phase==="prep"?60:talkSecs;
    left=secs; started=Date.now();
    $("#spBtn").disabled=true; $("#spBtn").textContent = phase==="prep"?"Preparing…":"Speaking…";
    if(phase==="talk" && SRC){
      $("#spLive").classList.remove("hidden");
      try{
        SR=new SRC(); SR.continuous=true; SR.interimResults=true; SR.lang="en-GB";
        SR.onresult=e=>{ let t="";
          for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript+" ";
          transcript=t; const el=$("#spText"); if(el) el.textContent=t; };
        SR.onerror=()=>{}; SR.start();
      }catch(e){ SR=null; }
    }
    every(()=>{
      left--; const el=$("#spt"); if(!el) return;
      el.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(Math.max(left,0)%60).padStart(2,"0")}`;
      el.classList.toggle("warn",left<=10);
      if(left<=0){ stopAllTimers();
        if(phase==="prep"){ phase="talk"; toast("Start speaking","Two minutes. Do not stop for corrections.","🎙️"); paint(); }
        else finish();
      }
    },1000);
  }
  function finish(){
    if(SR){ try{SR.stop()}catch(e){} SR=null; }
    if(part!==2 && qi<qs.length-1){ qi++; phase="talk"; transcript=""; paint(); return; }
    const secs=talkSecs;
    const words=(transcript.match(/[A-Za-z'’]+/g)||[]).map(w=>w.toLowerCase());
    const has=words.length>8;
    const wpm=has?Math.round(words.length/(secs/60)):0;
    const uniq=has?new Set(words).size:0;
    const fillers=has?(transcript.match(/\b(um+|uh+|er+|ehm|like|you know|actually|basically)\b/gi)||[]).length:0;
    let est=null;
    if(has){
      let b=5.0;
      b += wpm>=110&&wpm<=175 ? 1.2 : wpm>=85 ? 0.7 : 0.2;
      const div=uniq/Math.sqrt(words.length*2);
      b += div>=3.4?1.3 : div>=2.9?1.0 : div>=2.4?0.6 : 0.2;
      b += words.length>=secs*1.6?0.6:0;
      b -= fillers/(secs/60)>=8?0.9 : fillers/(secs/60)>=4?0.5 : 0;
      est=roundBand(clamp(b,3.5,8.5));
      S.bands.speaking = roundBand((S.bands.speaking||est)*0.6+est*0.4);
    }
    S.speakings.unshift({t:Date.now(), part, seconds:secs, words:words.length, wpm, est});
    S.speakings=S.speakings.slice(0,40); save();
    const xp=40+(has?Math.min(40,Math.round(words.length/6)):0);
    endGame(has?wpm:secs, xp,
      `<div class="card tight">
        <div class="eyebrow" style="margin-bottom:10px">${has?"Delivery metrics":"Self-review"}</div>
        ${has?`
          <div class="kv"><span class="small">Words spoken</span><span class="mono small">${words.length}</span></div>
          <div class="kv"><span class="small">Speaking rate</span><span class="mono small">${wpm} wpm ${wpm<95?"— a little slow":wpm>185?"— very fast":"— natural range"}</span></div>
          <div class="kv"><span class="small">Distinct words</span><span class="mono small">${uniq}</span></div>
          <div class="kv"><span class="small">Fillers detected</span><span class="mono small">${fillers}</span></div>
          <div class="kv"><span class="small">Provisional band</span><span class="pill gold mono">${fmtBand(est)}</span></div>
          <p class="tiny muted" style="margin-top:10px">Transcription cannot judge pronunciation or grammatical accuracy, so treat this as a fluency signal only. Record yourself separately and listen back for the rest.</p>`
        : `<p class="small">No transcript was captured. Score yourself honestly on three things: did you fill the whole time, did you avoid long pauses, and did you answer every bullet on the card?</p>`}
      </div>
      ${transcript?`<div class="card tight" style="margin-top:12px"><div class="eyebrow" style="margin-bottom:8px">What you said</div>
        <div class="small" style="max-height:200px;overflow-y:auto">${esc(transcript)}</div></div>`:""}`,
      { ico:"🎙️", title:has?`${wpm} words per minute`:"Talk complete", sub:`Part ${part} · ${secs} seconds`, line:`Part ${part} spoken` });
  }
}

/* ============================================================================
   BOOT
   ============================================================================ */
(async function boot(){
  const splash=document.getElementById("view-onboard");
  if(splash) splash.innerHTML=`<div class="center" style="padding:22vh 20px"><div class="eyebrow">Band Ascent</div>
    <h1 style="margin:10px 0 8px">Loading the question library…</h1>
    <p class="small muted">Reading band-ascent-content.json</p></div>`;
  await Content.load();
  Speech.init();
  auditStreak();
  paintChrome();
  Nudge.reset(); Nudge.clock();

  const lastSeen=S.lastSeen; S.lastSeen=Date.now(); save();

  if(!S.assessed){ renderOnboard(); go("onboard"); }
  else{
    todayQuests();
    go("home");
    const hrs = lastSeen ? (Date.now()-lastSeen)/36e5 : 0;
    if(hrs>=20){
      later(()=>toast("Welcome back",
        S.streak>0?`Your ${S.streak}-day streak is still alive. One drill keeps it that way.`
                  :"It has been a while. Start with a short drill — momentum beats intensity.","👋",9000),900);
    }
    later(()=>{
      const q=todayQuests().filter(x=>!x.done).length;
      if(q) toast("Today's plan is ready",`${q} task${q===1?"":"s"} waiting, built around your weakest skills.`,"📋",7000);
    },2200);
  }

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if($("#modalHost").innerHTML) closeModal(); else if(current==="play") quitGame(); }
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    const opts=$$("#opts .opt:not(.locked), #ro .opt:not(.locked), #po .opt:not(.locked), #go .opt:not(.locked)");
    if(opts.length && /^[1-4a-dA-D]$/.test(e.key)){
      const i="1234".indexOf(e.key)>=0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
      if(i>=0 && opts[i]) opts[i].click();
    }
  });
  window.addEventListener("beforeunload",()=>{ S.lastSeen=Date.now(); save(); });
})();
</script>
