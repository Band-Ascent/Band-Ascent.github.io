<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0F2233">
<meta name="description" content="Band Ascent — free, open-source, offline-first practice for the IELTS exam. Adaptive band estimate, a study plan built from your weakest skills, and nine timed drills. An independent project, not affiliated with the IELTS Partners.">
<title>Band Ascent — practice for the IELTS exam</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%230F2233'/><rect x='12' y='36' width='10' height='16' rx='3.2' fill='%233E6076'/><rect x='27' y='27' width='10' height='25' rx='3.2' fill='%230E7C86'/><rect x='42' y='14' width='10' height='38' rx='3.2' fill='%23E8A32D'/></svg>">
<style>
/* ============================================================
   BAND ASCENT — design system
   Palette: cool porcelain paper, deep navy instrument panel,
   marigold needle. Type: Bricolage Grotesque / Public Sans /
   JetBrains Mono for all numerals and timers.
   ============================================================ */
:root{
  --paper:#EAEFF4; --paper-2:#DFE7EE; --card:#FFFFFF;
  --ink:#0F2233; --ink-2:#274257; --muted:#5A7183; --faint:#8FA3B3;
  --line:#D6DFE7; --line-2:#C3D0DB;
  --panel:#0F2233; --panel-2:#183246; --panel-line:#2B4A61;
  --gold:#E8A32D; --gold-soft:#FBEBCB; --gold-deep:#B87E14;
  --teal:#0E7C86; --teal-soft:#D7EDEF; --teal-deep:#0A5A61;
  --mint:#17A673; --mint-soft:#D8F2E7;
  --coral:#D64545; --coral-soft:#FBE0E0;
  --violet:#6D5BD0; --violet-soft:#E6E2FA;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --sh-1:0 1px 2px rgba(15,34,51,.06), 0 2px 8px rgba(15,34,51,.05);
  --sh-2:0 2px 6px rgba(15,34,51,.07), 0 12px 28px rgba(15,34,51,.09);
  --sh-panel:0 18px 40px rgba(15,34,51,.28);
  --f-disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, rgba(15,34,51,.055) 1px, transparent 0);
  background-size:22px 22px;
  min-height:100vh; overflow-x:hidden;
}
/* Element rules are scoped under `body` so they outrank the Tailwind CDN
   reset, which injects itself after this stylesheet at runtime. */
body h1,body h2,body h3,body h4{font-family:var(--f-disp); font-weight:800; letter-spacing:-.02em; margin:0; line-height:1.15; color:var(--ink)}
body h1{font-size:clamp(1.7rem,4.4vw,2.5rem)}
body h2{font-size:clamp(1.25rem,3vw,1.6rem)}
body h3{font-size:1.05rem; font-weight:600}
body p{margin:0}
body ul{list-style:disc}
body li{margin-bottom:4px}
body summary::-webkit-details-marker{display:revert}
body button,body input,body select,body textarea{font-family:inherit; font-size:inherit; color:inherit}
body button{cursor:pointer; border:0; background:none}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono); font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:.85rem} .tiny{font-size:.76rem}
.center{text-align:center}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app frame ---------- */
.app{display:flex; min-height:100vh}
.rail{
  width:236px; flex:0 0 236px; background:var(--panel); color:#DCE7EF;
  padding:22px 16px calc(22px + env(safe-area-inset-bottom)); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:6px; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 20px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;flex:0 0 34px}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--f-disp); font-weight:800; font-size:1.05rem; color:#fff; letter-spacing:-.02em; line-height:1.1}
.brand-sub{font-family:var(--f-mono); font-size:.6rem; letter-spacing:.16em; color:#7E9AAF; text-transform:uppercase}
.nav-btn{
  display:flex; align-items:center; gap:11px; width:100%; padding:10px 12px; border-radius:10px;
  color:#A9C0D1; font-weight:500; font-size:.93rem; text-align:left; transition:background .16s,color .16s;
}
.nav-btn svg{width:18px;height:18px;flex:0 0 18px;stroke-width:1.9}
.nav-btn:hover{background:rgba(255,255,255,.06); color:#fff}
.nav-btn.on{background:rgba(232,163,45,.15); color:#F7C46C}
.nav-btn.on svg{color:var(--gold)}
.rail-foot{margin-top:auto; border-top:1px solid var(--panel-line); padding-top:14px}
.rail-streak{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:.85rem;color:#A9C0D1}
.main{flex:1; min-width:0; padding:26px clamp(14px,3vw,38px) 90px; max-width:1180px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:22px}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:22px; box-shadow:var(--sh-1)}
.card.tight{padding:16px; border-radius:var(--r-m)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:16px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:11px;font-weight:600;font-size:.93rem;
  background:var(--teal);color:#fff;transition:transform .12s,box-shadow .16s,background .16s;
  box-shadow:0 2px 0 var(--teal-deep);
}
.btn:hover{background:#0c6d76;transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 0 0 var(--teal-deep)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.gold{background:var(--gold);color:#3B2A05;box-shadow:0 2px 0 var(--gold-deep)}
.btn.gold:hover{background:#f0ae3d}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--paper-2)}
.btn.dark{background:var(--panel);box-shadow:0 2px 0 #06131f}
.btn.sm{padding:7px 13px;font-size:.84rem;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{background:var(--coral);box-shadow:0 2px 0 #a83636}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--paper-2);color:var(--ink-2)}
.pill.gold{background:var(--gold-soft);color:#7A5405}
.pill.teal{background:var(--teal-soft);color:var(--teal-deep)}
.pill.mint{background:var(--mint-soft);color:#0B6A48}
.pill.coral{background:var(--coral-soft);color:#8E2B2B}
.pill.violet{background:var(--violet-soft);color:#453797}

/* ---------- the signature: band dial ---------- */
.dial-panel{
  background:linear-gradient(168deg,var(--panel-2),var(--panel));
  border-radius:var(--r-l); padding:22px 22px 18px; color:#E6EEF4; box-shadow:var(--sh-panel);
  position:relative; overflow:hidden;
}
.dial-panel::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% -10%,rgba(232,163,45,.16),transparent 60%);pointer-events:none}
.dial-wrap{position:relative;display:grid;place-items:center}
.dial-readout{position:absolute;bottom:2px;text-align:center;width:100%}
.dial-num{font-family:var(--f-mono);font-weight:700;font-size:clamp(2.4rem,7vw,3.2rem);color:var(--gold);line-height:1;letter-spacing:-.03em}
.dial-label{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:#7E9AAF;margin-top:4px}
.needle{transform-origin:100px 92px; animation:sweep 1.6s cubic-bezier(.22,1.25,.32,1) both}
@keyframes sweep{from{transform:rotate(-90deg)}}
.dial-num{animation:rise .9s .5s cubic-bezier(.2,1,.3,1) both}

/* ---------- xp / bars ---------- */
.bar{height:9px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#F5C462);transition:width .8s cubic-bezier(.3,1.2,.4,1)}
.bar.teal > i{background:linear-gradient(90deg,var(--teal),#25A5AF)}
.bar.mint > i{background:linear-gradient(90deg,var(--mint),#4CCB9B)}
.bar.dark{background:rgba(255,255,255,.12)}

/* ---------- stat tiles ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.stat-v{font-family:var(--f-mono);font-weight:700;font-size:1.55rem;letter-spacing:-.02em;line-height:1.1}
.stat-k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ---------- lists / tasks ---------- */
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);transition:border-color .15s,transform .15s}
.task:hover{border-color:var(--line-2);transform:translateX(2px)}
.task.done{background:var(--mint-soft);border-color:#B6E4D2}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px;background:var(--paper-2)}
.task-title{font-weight:600;font-size:.94rem}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);flex:0 0 22px;display:grid;place-items:center}
.task.done .check{background:var(--mint);border-color:var(--mint);color:#fff}

/* ---------- games grid ---------- */
.game-card{
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--r-l);
  padding:18px; text-align:left; transition:transform .18s,box-shadow .18s,border-color .18s; overflow:hidden; display:block; width:100%;
}
.game-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.game-card .gc-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}
.game-card h3{margin-bottom:4px}
.gc-best{position:absolute;top:14px;right:14px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}

/* ---------- quiz / play surface ---------- */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:clamp(18px,3vw,30px);box-shadow:var(--sh-1)}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:13px 15px;margin-bottom:9px;
  border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--card);font-size:.95rem;transition:all .14s;
}
.opt:hover:not(.locked){border-color:var(--teal);background:var(--teal-soft)}
.opt .key{font-family:var(--f-mono);font-size:.75rem;font-weight:700;width:22px;height:22px;border-radius:6px;background:var(--paper-2);display:grid;place-items:center;flex:0 0 22px;margin-top:1px}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}
.opt.ok .key{background:var(--mint);color:#fff}
.opt.no{border-color:var(--coral);background:var(--coral-soft)}
.opt.no .key{background:var(--coral);color:#fff}
.opt.locked{cursor:default}
.passage{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r-m);padding:16px 18px;font-size:.94rem;line-height:1.72;max-height:340px;overflow-y:auto}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ticker{display:flex;gap:4px}
.ticker i{width:20px;height:4px;border-radius:99px;background:var(--line-2);display:block}
.ticker i.on{background:var(--gold)} .ticker i.now{background:var(--teal)}
textarea.write{width:100%;min-height:220px;padding:15px;border:1.5px solid var(--line);border-radius:var(--r-m);resize:vertical;line-height:1.7;background:var(--card)}
textarea.write:focus{border-color:var(--teal);outline:none}
input.field,select.field{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
input.field:focus,select.field:focus{border-color:var(--teal);outline:none}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;padding:4px 11px;border-radius:9px;background:var(--panel);color:#F7C46C}
.timer.warn{background:var(--coral);color:#fff;animation:pulse .9s infinite}

/* ---------- game bits ---------- */
.tile{padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-weight:600;font-size:.92rem;transition:all .13s}
.tile:hover{border-color:var(--teal);background:var(--teal-soft)}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.ok{border-color:var(--mint);background:var(--mint-soft);color:#0B6A48}
.tile.no{border-color:var(--coral);background:var(--coral-soft);animation:shake .32s}
.tile.gone{opacity:.25;pointer-events:none}
.combo{font-family:var(--f-mono);font-weight:700;color:var(--gold)}
.lives{display:flex;gap:4px}
.lives i{width:11px;height:11px;border-radius:50%;background:var(--coral);display:block}
.lives i.off{background:var(--line-2)}
.slot{min-height:56px;border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;background:var(--paper)}

/* ---------- charts ---------- */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--paper-2);display:block}
.heat i[data-l="1"]{background:#BFE4E7} .heat i[data-l="2"]{background:#79C9CF}
.heat i[data-l="3"]{background:#2C939C} .heat i[data-l="4"]{background:var(--teal-deep)}
.badge{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 10px;text-align:center;background:var(--card);transition:transform .16s}
.badge.locked{opacity:.42;filter:grayscale(1)}
.badge:hover{transform:translateY(-2px)}
.badge .bi{font-size:1.5rem;line-height:1}
.badge .bn{font-weight:600;font-size:.78rem;margin-top:5px}

/* ---------- toast / modal ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:90;max-width:min(340px,86vw)}
.toast{background:var(--panel);color:#E6EEF4;padding:12px 15px;border-radius:var(--r-m);box-shadow:var(--sh-panel);font-size:.88rem;display:flex;gap:10px;align-items:flex-start;animation:slideIn .3s cubic-bezier(.2,1.3,.4,1)}
.toast b{color:var(--gold);font-family:var(--f-disp)}
.scrim{position:fixed;inset:0;background:rgba(15,34,51,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:18px}
.modal{background:var(--card);border-radius:var(--r-l);padding:26px;max-width:520px;width:100%;box-shadow:var(--sh-panel);animation:pop .32s cubic-bezier(.2,1.3,.4,1);max-height:88vh;overflow-y:auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}

/* ---------- misc ---------- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.kv:last-child{border-bottom:0}
.banner{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:var(--r-m);background:var(--gold-soft);border:1px solid #F0D9A6;font-size:.9rem;margin-bottom:18px}
.seg{display:inline-flex;background:var(--paper-2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-1)}
.rowwrap{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- animations ---------- */
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.rise{animation:rise .42s cubic-bezier(.2,1,.3,1) both}
.rise:nth-child(2){animation-delay:.05s} .rise:nth-child(3){animation-delay:.1s}
.rise:nth-child(4){animation-delay:.15s} .rise:nth-child(5){animation-delay:.2s}
.rise:nth-child(6){animation-delay:.25s}
.flame{display:inline-block;animation:flame 1.6s ease-in-out infinite}
.float-xp{position:fixed;font-family:var(--f-mono);font-weight:700;color:var(--gold);pointer-events:none;z-index:110;text-shadow:0 2px 6px rgba(0,0,0,.2)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  body{padding-bottom:0}
  .app{flex-direction:column}
  .rail{
    position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:2px;justify-content:space-around;
    border-top:1px solid var(--panel-line);
  }
  .brand,.rail-foot{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:.62rem;padding:7px 3px;text-align:center;border-radius:9px}
  .nav-btn svg{width:20px;height:20px;flex:0 0 20px}
  .main{padding:18px 14px 108px;max-width:100%}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .card{padding:17px;border-radius:var(--r-m)}
  .toasts{right:10px;left:10px;bottom:84px;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
@media print{.rail{display:none}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ NAVIGATION RAIL ============ -->
  <nav class="rail" id="rail" aria-label="Main">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="36" width="10" height="16" rx="3.2" fill="#3E6076"/><rect x="27" y="27" width="10" height="25" rx="3.2" fill="#0E7C86"/><rect x="42" y="14" width="10" height="38" rx="3.2" fill="#0F2233"/></svg>
      </div>
      <div>
        <div class="brand-name">Band Ascent</div>
        <div class="brand-sub">Exam practice</div>
      </div>
    </div>

,"Domestic disuse among the young hastens the decline of a language.","Long-established skills are being lost with the retirement of practitioners.","Children's home use has no bearing on language survival."],"a":1,"ok":"Domestic disuse among the young hastens the decline of a language."},{"id":"P52","b":7.0,"tier":"hard","s":"Free public transport would mainly benefit lower-income households.","opts":["Formal consultation seldom alters the outcome that was already intended.","Removing fares would deliver the greatest gain to poorer families.","Free transport would chiefly benefit wealthy commuters.","Comparable outcomes were reached by the programmes despite unequal expenditure."],"a":1,"ok":"Removing fares would deliver the greatest gain to poorer families."},{"id":"P88","b":7.5,"tier":"hard","s":"The two schemes achieved similar results at very different costs.","opts":["The cheaper scheme achieved far worse results.","Municipal bodies rely to a large extent on money from national government.","Comparable outcomes were reached by the programmes despite unequal expenditure.","Electoral participation is generally lower among the young."],"a":2,"ok":"Comparable outcomes were reached by the programmes despite unequal expenditure."},{"id":"P41","b":7.0,"tier":"hard","s":"Inflation erodes the value of savings over time.","opts":["Inflation increases the real value of savings.","Rising prices gradually diminish the purchasing power of money held.","The assumption that growth is inherently positive is contested.","A substantial number of families lack the means for sufficient heating."],"a":1,"ok":"Rising prices gradually diminish the purchasing power of money held."}],"forge":[{"id":"F56","b":5.5,"tier":"easy","words":["Every","applicant","must","submit","two","references","before","the","closing","date"],"note":"Modal obligation"},{"id":"F11","b":6.0,"tier":"medium","words":["While","some","argue","for","stricter","rules",",","others","favour","voluntary","codes"],"not nd","to","pay","for","themselves","over","time"],"note":"Interrupting concessive phrase"},{"id":"F10","b":8.0,"tier":"hardest","words":["So","marginal","was","the","difference","that","the","team","declined","to","report","it"],"note":"Inversion after fronted 'so + adjective'"},{"id":"F12","b":8.0,"tier":"hardest","words":["Only","after","the","audit","was","completed","did","the","board","acknowledge","the","problem"],"note":"Inversion after 'only after'"},{"id":"F64","b":8.5,"tier":"hardest","words":["Were","it","not","for","the","volunteers",",","the","service","would","have","closed"],"note":"'Were it not for' hypothetical"},{"id":"F42","b":8.0,"tier":"hardest","words":["Far","from","solving","the","problem",",","the","reform","made","matters","worse"],"note":"'Far from' + gerund"},{"id":"F69","b":8.5,"tier":"hardest","words":["Nowhere","is","this","pattern","more","evident","than","in","coastal","cities"],"note":"Inversion after 'nowhere'"}],"dictation":[{"id":"D89","b":5.5,"tier":"easy","s":"There is a small charge for using the laundry facilities."},{"id":"D90","b":5.0,"tier":"easy","s":"The nearest supermarket is a ten-minute walk from the flat."},{"id":"D13","b":5.5,"tier":"easy","s":"The organisation was founded in nineteen seventy-four."},{"id":"D24","b":5.5,"tier":"easy","s":"The library is closed for refurbishment until the end of August."},{"id":"D77","b":5.5,"tier":"easy","s":"Guided tours depart from the main entrance on the hour."},{"id":"D85","b":5.5,"tier":"easy","s":"Bills for electricity and water are not included in the rent."},{"id":"D88","b":5.5,"tier":"easy","s":"Rubbish is collected on Tuesday mornings before eight o'clock."},{"id":"D84","b":5.0,"tier":"easy","s":"The apartment has two bedrooms and a shared balcony."},{"id":"D104","b":6.5,"tier":"medium","s":"The wind farm supplies electricity to around forty thousand homes."},{"id":"D33","b":6.0,"tier":"medium","s":"The committee will reconvene on the third of November."},{"id":"D51","b":6.5,"tier":"medium","s":"Rainfall in the region is highly variable from year to year."},{"id":"D64","b":6.0,"tier":"medium","s":"Late submissions will be penalised at five per cent per day."},{"id":"D97","b":6.5,"tier":"medium","s":"Interviews are scheduled to take place in the second week of June."},{"id":"D58","b":6.5,"tier":"medium","s":"Participants were asked to keep a diary for fourteen consecutive days."},{"id":"D98","b":6.5,"tier":"medium","s":"Applicants should submit a covering letter and a full curriculum vitae."},{"id":"D102","b":6.5,"tier":"medium","s":"The city aims to become carbon neutral within fifteen years."},{"id":"D99","b":7.0,"tier":"hard","s":"The department is committed to flexible working arrangements."},{"id":"D55","b":7.5,"tier":"hard","s":"The manuscript had been stored in unsuitable conditions for decades."},{"id":"D36","b":7.0,"tier":"hard","s":"A significant proportion of the equipment was found to be obsolete."},{"id":"D109","b":7.5,"tier":"hard","s":"Enforcement has so far been inconsistent across the region."},{"id":"D93","b":7.0,"tier":"hard","s":"Previous experience in a laboratory setting is highly desirable."},{"id":"D46","b":7.5,"tier":"hard","s":"The proposal met with resistance from several member states."},{"id":"D38","b":7.0,"tier":"hard","s":"The findings should be interpreted with a degree of caution."},{"id":"D44","b":7.5,"tier":"hard","s":"The scheme was suspended pending the outcome of the inquiry."},{"id":"D48","b":8.0,"tier":"hardest","s":"The correlation, though statistically significant, is rather weak."},{"id":"D47","b":8.0,"tier":"hardest","s":"Evidence from longitudinal studies is notoriously difficult to obtain."},{"id":"D95","b":8.0,"tier":"hardest","s":"Salary will be commensurate with qualifications and experience."}],"skim":[{"id":"SK2","b":6.0,"tier":"medium","text":"Sri Lanka's tea industry began almost by accident. Coffee had been the island's principal export until a fungal disease destroyed the plantations in the 1870s. Planters, facing ruin, experimented with Camellia sinensis, which tolerated the highland climate well. By 1900 tea had replaced coffee entirely. Today the highest-grown leaf, from estates above 1,200 metres, commands the strongest prices, though the majority of production by volume comes from lower elevations.","st":[{"s":"Coffee was replaced because of a plant disease.","a":0,"b":6.0},{"s":"Tea was grown in Sri Lanka before coffee.","a":1,"b":6.0},{"s":"Most tea by volume comes from high-altitude estates.","a":1,"b":6.0},{"s":"High-grown tea sells at higher prices.","a":0,"b":6.0},{"s":"The government funded the switch to tea.","a":2,"b":6.0}]},{"id":"SK7","b":6.5,"tier":"medium","text":"Coral bleaching occurs when stressed corals expel the algae living in their tissues, losing both colour and their main energy source. The most common trigger is elevated sea temperature sustained over several weeks. Bleaching is not immediately fatal; corals can recover if conditions return to normal quickly enough. Repeated events, however, leave little time for recovery, and reefs that once bleached once a decade now experience it several times as often.","st":[{"s":"Bleached corals have lost their symbiotic algae.","a":0,"b":6.5},{"s":"Bleaching always kills the coral immediately.","a":1,"b":6.5},{"s":"Sustained high temperatures are the commonest cause.","a":0,"b":6.5},{"s":"Recovery is possible if conditions improve quickly.","a":0,"b":6.5},{"s":"Bleaching has been eliminated in protected reserves.","a":2,"b":6.5}]},{"id":"SK6","b":7.0,"tier":"hard","text":"Paper money appeared in China several centuries before it did in Europe. Merchants in the Tang period deposited coin with trusted agents and received certificates that could be redeemed elsewhere, avoiding the need to transport heavy strings of bronze. The state later issued notes directly. Repeated episodes of over-issue led to sharp inflation, and by the fifteenth century the Ming had largely abandoned paper in favour of silver.","st":[{"s":"Paper money was used in China before Europe.","a":0,"b":7.0},{"s":"The earliest certificates were issued by the state.","a":1,"b":7.0},{"s":"Over-issue of notes caused inflation.","a":0,"b":7.0},{"s":"Silver was imported entirely from Japan.","a":2,"b":7.0},{"s":"The Ming continued expanding paper currency into the sixteenth century.","a":1,"b":7.0}]},{"id":"SK12","b":7.0,"tier":"hard","text":"Vertical farming grows crops in stacked indoor layers under controlled light. Yields per square metre are high and water use is a small fraction of field agriculture. Energy is the constraint: lighting and climate control dominate operating costs, so the economics depend heavily on electricity prices. The technique is therefore concentrated in leafy greens and herbs, which are light, fast-growing and command a premium, rather than in staple grains.","st":[{"s":"Vertical farming uses less water than field agriculture.","a":0,"b":7.0},{"s":"Energy costs are the main economic constraint.","a":0,"b":7.0},{"s":"Staple grains are the most common vertical-farm crop.","a":1,"b":7.0},{"s":"Leafy greens grow quickly and sell at a premium.","a":0,"b":7.0},{"s":"Vertical farms are mainly located in tropical countries.","a":2,"b":7.0}]}],"reading":[{"id":"R1","b":6.5,"tier":"medium","title":"The quiet economics of repair","text":"For most of the twentieth century, repair was ordinary. A radio, a kettle or a pair of shoes was expected to be mended several times before it was discarded, and most high streets supported at least one workshop that did nothing else. The decline of that trade is usually blamed on cheap manufacturing, and the price data appear to support the story: between 1970 and 2010 the real cost of most household electrical goods fell by more than eighty per cent, while the hourly cost of skilled labour rose steadily. Once an hour of a technician's time cost more than a replacement appliance, the economic argument for repair collapsed.\n\nYet price alone does not explain the whole shift. Design changed too, and it changed in ways that were rarely announced. Screws gave way to clips and then to adhesive; modular circuit boards gave way to sealed assemblies; batteries stopped being user-replaceable. Manufacturers describe these decisions in the language of slimness, waterproofing and reliability, and in fairness those benefits are real. But the same decisions have the side effect of transferring repair from the owner to the manufacturer, and often of removing it altogether.\n\nThe response, gathering pace since around 2015, has been a set of so-called right-to-repair campaigns. Their central demand is not that products should be built to last for ever, which no campaigner seriously proposes, but that spare parts, diagnostic software and service manuals should be available to independent workshops on the same terms as to authorised dealers. Several jurisdictions have now legislated in this direction. Early evidence from France, which introduced a repairability index in 2021, suggests that the score influences purchasing more than regulators expected, though it remains difficult to separate that effect from the general rise in environmental awareness over the same period.","qs":[{"type":"tfng","q":"The writer states that cheap manufacturing was the only reason repair declined.","a":1,"b":6,"tier":"medium","tip":"The second paragraph opens by rejecting price as a complete explanation, so the statement contradicts the text."},{"type":"tfng","q":"Most high streets in the twentieth century had at least one repair workshop.","a":0,"b":5.5,"tier":"easy","tip":"Stated directly in paragraph one."},{"type":"tfng","q":"French consumers now repair more devices than consumers in other countries.","a":2,"b":6.5,"tier":"medium","tip":"The passage mentions the index influencing purchasing, but never compares repair rates between countries."},{"type":"mcq","q":"The writer's attitude to manufacturers' design explanations is best described as","a":1,"b":7,"tier":"hard","tip":"'In fairness those benefits are real' concedes the point before naming the side effect.","opts":["dismissive — the reasons are pretexts","partly accepting — the benefits are real but there are side effects","enthusiastic — slimness matters more than repair","neutral — the writer offers no view"]},{"type":"mcq","q":"What do right-to-repair campaigners primarily demand?","a":2,"b":6.5,"tier":"medium","tip":"Paragraph three states the demand explicitly and rules out the 'last for ever' option.","opts":["That products last indefinitely","That repairs be free of charge","Access to parts, software and manuals for independent workshops","A ban on adhesive in consumer electronics"]},{"type":"mcq","q":"Why does the writer say the French evidence is hard to interpret?","a":2,"b":7,"tier":"hard","tip":"The final sentence names the confounding factor.","opts":["The index was withdrawn","Too few products were scored","Environmental attitudes shifted at the same time","Retailers refused to display the score"]}]},{"id":"R8","b":7.0,"tier":"hard","title":"The map that was mostly guesswork","text":"Early modern maps are often admired for their beauty and mistrusted for their accuracy, and the second judgement deserves qualification. A sixteenth-century chart of the Atlantic coast could be remarkably precise about the details that mattered to its users — the depth of an anchorage, the bearing between two headlands — while being wildly wrong about the interior of a continent a hundred kilometres inland. The map was not a general description of the world. It was an instrument for a particular task, and its accuracy was distributed accordingly.\n\nThis explains a feature that puzzles modern viewers: the confident depiction of places nobody had visited. Blank space on a chart was commercially awkward, since a purchaser wanted a complete document, and cartographers filled gaps by combining sailors' reports, classical authority and inference from coastlines. The resulting features were not always understood as speculation by those who copied them. A river drawn tentatively in one decade could appear as an established fact in the next, and might survive for a century after expeditions had failed to find it.\n\nHistorians of cartography have therefore become cautious about treating maps as records of knowledge. They are better read as records of what was believed, wanted or claimed. A boundary drawn firmly through unsurveyed territory may tell us nothing about the ground and a great deal about a political claim being asserted. Some of the most informative maps, on this reading, are the least accurate ones, because the errors are not random. They cluster where interests were strongest.","qs":[{"type":"tfng","q":"Early charts could be accurate about coastal detail while wrong about inland areas.","a":0,"b":6.5,"tier":"medium","tip":"Stated directly in the first paragraph."},{"type":"tfng","q":"Cartographers always indicated clearly which features were speculative.","a":1,"b":7.0,"tier":"hard","tip":"The passage says speculation was not always understood as such by later copyists."},{"type":"tfng","q":"Sixteenth-century maps were more expensive than written sailing directions.","a":2,"b":7.0,"tier":"hard","tip":"Commercial awkwardness of blank space is mentioned, but prices are not discussed."},{"type":"mcq","q":"Why did cartographers fill in unknown areas?","a":1,"b":6.5,"tier":"medium","tip":"Blank space was commercially awkward because purchasers wanted completeness.","opts":["They had reliable reports from explorers","Buyers expected a complete document","Blank areas were forbidden by law","They were copying satellite observations"]},{"type":"mcq","q":"What does the writer mean by saying the errors 'are not random'?","a":1,"b":7.5,"tier":"hard","tip":"The closing sentence states errors cluster where interests were strongest.","opts":["They were deliberately introduced to mislead","They concentrate where political or commercial interests lay","They occur only near coastlines","They were corrected in later editions"]},{"type":"mcq","q":"The writer suggests that inaccurate maps can be valuable because they reveal","a":1,"b":7.5,"tier":"hard","tip":"Maps are recommended as records of belief, desire and claim rather than of terrain.","opts":["the limits of surveying technology","what was believed or claimed at the time","the routes taken by expeditions","the artistic conventions of the period"]}]},{"id":"R10","b":8.0,"tier":"hardest","title":"The problem of the average","text":"In the 1940s the United States Air Force investigated an unusually high rate of accidents among its pilots. Having eliminated training and mechanical failure, investigators turned to the cockpit itself, which had been dimensioned in 1926 using the average measurements of several hundred pilots. A researcher was asked to check whether the averages had drifted upwards. He measured over four thousand pilots on ten dimensions and then asked a question nobody had thought to ask: how many of them were close to average on all ten? The answer was none. Even on three dimensions, fewer than one in twenty qualified.\n\nThe conclusion was not that the averages were wrong but that designing for the average produced an object that fitted nobody. The response — adjustable seats, pedals and straps — is now so familiar that its novelty is hard to recall, and accident rates fell.\n\nThe episode is frequently retold as a lesson about ergonomics, but its deeper implication concerns statistics. An average is a summary of a distribution, not a description of a member of it, and the two are easily confused when the average is treated as a type. The confusion recurs wherever a single figure is used to stand for a varied population: a typical patient's response to a drug, a representative student's progress, an ordinary household's energy use. In each case the average may be a perfectly accurate summary while describing nobody in particular.\n\nWhat the cockpit case adds is a practical corrective. Where variation is large, the useful design question is not what the typical user needs but what range must be accommodated — and, crucially, whether the object can be made adjustable rather than fixed. That reframing costs something. Adjustability is more expensive to manufacture and more complicated to use, which is why the argument still has to be made repeatedly in fields that have not yet had their own cockpit moment.","qs":[{"type":"tfng","q":"The cockpit dimensions had been based on measurements taken in 1926.","a":0,"b":6.5,"tier":"medium","tip":"Stated in the first paragraph."},{"type":"tfng","q":"The investigation found that pilots had grown larger since the 1920s.","a":2,"b":7.5,"tier":"hard","tip":"That was the hypothesis he was asked to check; the passage never reports whether it was confirmed."},{"type":"tfng","q":"No pilot in the sample was close to average on all ten dimensions.","a":0,"b":7.0,"tier":"hard","tip":"The answer to the researcher's question was 'none'."},{"type":"mcq","q":"The writer's central statistical point is that an average","a":1,"b":8.0,"tier":"hardest","tip":"'An average is a summary of a distribution, not a description of a member of it.'","opts":["is usually calculated incorrectly","summarises a distribution without describing any individual","should be replaced by the median","becomes inaccurate over time"]},{"type":"mcq","q":"What does the writer say the cockpit case adds to the statistical argument?","a":1,"b":8.0,"tier":"hardest","tip":"The final paragraph reframes the design question around range and adjustability.","opts":["A historical curiosity with no wider use","A practical corrective: design for a range and make things adjustable","Proof that averages should never be used","Evidence that training matters more than equipment"]},{"type":"mcq","q":"Why does the writer say the argument must be made repeatedly?","a":1,"b":8.0,"tier":"hardest","tip":"Adjustability is more expensive and more complicated, so the case has to be re-argued.","opts":["Because statisticians disagree about averages","Because adjustability carries real costs in manufacture and use","Because accident rates have risen again","Because the original study was never published"]}]}],"listening":[{"id":"L5","b":5.0,"tier":"easy","title":"Sports centre membership","script":"Thanks for calling the university sports centre. Membership runs from October to June and costs ninety pounds for students, or one hundred and forty for staff. That includes the gym, the pool and all fitness classes except squash, which is booked separately at four pounds a court. You can join online, but you must come in person with your student card before your first session so we can take a photograph for the pass. The centre opens at half past six on weekdays and eight o'clock at weekends.","qs":[{"q":"How much does student membership cost?","opts":["Four pounds","Ninety pounds","One hundred and forty pounds","Eight pounds"],"a":1,"b":4.5,"tier":"easy"},{"q":"What must members do in person before their first session?","opts":["Pay the fee in cash","Have a photograph taken","Book a squash court","Complete a fitness test"],"a":1,"b":5.0,"tier":"easy"},{"q":"Which activity is not included in the membership?","opts":["Swimming","Fitness classes","Squash","Gym access"],"a":2,"b":5.5,"tier":"easy"}]},{"id":"L1","b":5.5,"tier":"easy","title":"Library induction","script":"Welcome to the university library. Your student card also works as your library card, so please carry it at all times. Undergraduates may borrow up to eight items for three weeks, while postgraduates may borrow fifteen items for six weeks. The self-service machines are on the ground floor, next to the main staircase. Please note that the third floor is a silent study area, and group discussion rooms must be booked online at least one day in advance.","qs":[{"q":"How many items can an undergraduate borrow?","opts":["Three","Six","Eight","Fifteen"],"a":2,"b":5,"tier":"easy"},{"q":"Group discussion rooms must be booked","opts":["at the front desk","online, at least a day ahead","on the third floor","by email to a librarian"],"a":1,"b":5.5,"tier":"easy"}]},{"id":"L13","b":6.0,"tier":"medium","title":"Museum tour introduction","script":"Before we start, three things. Photography is allowed everywhere except the textile gallery on the first floor, where the light levels would damage the dyes. Please keep bags on your back rather than your shoulder — most of our damage incidents come from swinging bags, not from people touching objects. And if you want to hear the audio guide in another language, ask at the desk rather than the shop; the shop only stocks the English version. The tour lasts about seventy minutes with one short break.","qs":[{"q":"Where is photography prohibited?","opts":["The whole museum","The textile gallery","The ground floor","The shop"],"a":1,"b":5.5,"tier":"easy"},{"q":"What causes most damage incidents?","opts":["Visitors touching objects","Camera flashes","Swinging bags","Bright lighting"],"a":2,"b":6.5,"tier":"medium"},{"q":"Where should visitors ask for other-language audio guides?","opts":["The shop","The desk","The textile gallery","Online"],"a":1,"b":6.0,"tier":"medium"}]},{"id":"L7","b":6.0,"tier":"medium","title":"Field trip briefing","script":"The coach leaves from the north gate at seven fifteen, not seven thirty as printed on the original handout, so please note the change. Bring waterproofs regardless of the forecast — the site is exposed and there is no shelter. You will be working in pairs, and each pair needs one clipboard and one measuring tape, which we will hand out on arrival. Lunch is not provided. We expect to be back on campus by about six, but if the tide is against us it could be an hour later.","qs":[{"q":"What time does the coach actually leave?","opts":["Seven fifteen","Seven thirty","Six o'clock","Eight o'clock"],"a":0,"b":5.5,"tier":"easy"},{"q":"What will be handed out at the site?","opts":["Waterproofs","Lunch","Clipboards and measuring tapes","Handouts"],"a":2,"b":6.0,"tier":"medium"},{"q":"What might delay the return?","opts":["Traffic","The tide","The weather forecast","A late start"],"a":1,"b":6.5,"tier":"medium"}]},{"id":"L10","b":7.0,"tier":"hard","title":"Seminar: measuring poverty","script":"Absolute measures set a fixed threshold — an income sufficient for a defined basket of goods. Relative measures set the line as a proportion of median income, typically sixty per cent. The two behave very differently in a recession. If everyone's income falls together, absolute poverty rises, but relative poverty may actually fall, because the median has fallen too. That is not a paradox; it simply reflects that the measures answer different questions. Absolute measures ask whether people can meet basic needs. Relative measures ask whether they can participate normally in the society they live in.","qs":[{"q":"In a recession where all incomes fall, relative poverty may","opts":["rise sharply","fall","remain fixed by law","become impossible to measure"],"a":1,"b":7.0,"tier":"hard"},{"q":"What question does a relative measure address?","opts":["Whether basic needs are met","Whether people can take part in normal social life","Whether the economy is growing","Whether prices have risen"],"a":1,"b":7.5,"tier":"hard"}]},{"id":"L18","b":7.5,"tier":"hard","title":"Lecture: urban heat islands","script":"City centres are consistently warmer than surrounding countryside, typically by two to five degrees at night. The cause is not, as is often assumed, primarily waste heat from vehicles and buildings, though that contributes. The dominant mechanism is thermal mass. Stone, brick and asphalt absorb solar radiation during the day and release it slowly after sunset, while vegetation and soil lose heat much faster through evaporation. This is why the difference is largest on still, clear nights and can vanish entirely in windy weather, when mixing overwhelms the local effect.","qs":[{"q":"What is the dominant cause of the urban heat island?","opts":["Waste heat from vehicles","The thermal mass of built surfaces","Air pollution","Reduced wind speed"],"a":1,"b":7.5,"tier":"hard"},{"q":"When is the effect largest?","opts":["On windy nights","On still, clear nights","During heavy rain","At midday"],"a":1,"b":7.0,"tier":"hard"}]},{"id":"L16","b":8.0,"tier":"hardest","title":"Seminar: the value of null results","script":"Journals overwhelmingly publish studies that find an effect, and this creates a distortion that is easy to state and hard to remedy. If twenty teams test a hypothesis that is in fact false, one will find a significant result by chance at the conventional threshold. If only that one is published, the literature records a positive finding and nineteen absences that nobody can see. Registered reports address this by having journals accept a study on the basis of its design, before the results exist. The commitment is binding, which removes the incentive to reframe an unpromising result.","qs":[{"q":"What distortion does the speaker describe?","opts":["Studies are too small","Only the chance positive result gets published","Hypotheses are poorly worded","Journals reject good designs"],"a":1,"b":8.0,"tier":"hardest"},{"q":"How do registered reports address the problem?","opts":["By increasing sample sizes","By accepting studies on design before results exist","By banning null results","By repeating every study twice"],"a":1,"b":8.0,"tier":"hardest"}]}],"writing":{"assess":{"id":"WA","task":2,"minutes":8,"minWords":100,"prompt":"Some people believe that students should be taught practical life skills — such as budgeting and cooking — during school hours. Others think schools should focus only on academic subjects.\n\nDiscuss both views and give your own opinion.","note":"For the calibration test, write at least 100 words in 8 minutes. In the real test you would have 40 minutes and 250 words."},"task2":[{"id":"W26","b":6.0,"tier":"medium","p":"Some argue university education should be free for all citizens. Others say students should pay their own fees. Discuss both views and give your opinion.","tag":"Discussion"},{"id":"W234","b":6.5,"tier":"medium","p":"The best way to reduce traffic congestion is to make driving more expensive. To what extent do you agree or disagree?","tag":"Opinion"},{"id":"W251","b":6.5,"tier":"medium","p":"Cities should prioritise cyclists over motorists. To what extent do you agree or disagree?","tag":"Opinion"},{"id":"W213","b":6.0,"tier":"medium","p":"Many people now shop online rather than in physical stores. What effects does this have on communities?","tag":"Cause & effect"},{"id":"W271","b":7.0,"tier":"hard","p":"Countries should prioritise their own citizens before offering foreign aid. To what extent do you agree or disagree?","tag":"Opinion"},{"id":"W224","b":7.0,"tier":"hard","p":"Some believe that people should retire later as life expectancy rises. Others disagree. Discuss both views and give your opinion.","tag":"Discussion"},{"id":"W276","b":7.0,"tier":"hard","p":"Reading fiction has no practical value. To what extent do you agree or disagree?","tag":"Opinion"},{"id":"W254","b":7.0,"tier":"hard","p":"Some argue that the minimum voting age should be lowered to sixteen. To what extent do you agree?","tag":"Opinion"},{"id":"W269","b":8.0,"tier":"hardest","p":"Is technological progress inevitable, or can societies meaningfully choose to slow it? Discuss both views.","tag":"Discussion"},{"id":"W268","b":8.0,"tier":"hardest","p":"Public health measures that restrict individual freedom are always justified in an emergency. To what extent do you agree?","tag":"Opinion"},{"id":"W282","b":8.0,"tier":"hardest","p":"Is it possible for a society to be both highly equal and highly innovative? Discuss.","tag":"Discussion"},{"id":"W266","b":8.0,"tier":"hardest","p":"The pursuit of happiness is a poor guide to how societies should be organised. To what extent do you agree?","tag":"Opinion"}],"task1":[{"id":"W113","b":6.5,"tier":"medium","p":"The diagram shows how rainwater is harvested and used in a domestic building.\n\nRoof collection → gutter and first-flush diverter → storage tank → filtration → pump → toilet flushing and garden irrigation; overflow to soakaway","tag":"Process"},{"id":"W12","b":6.5,"tier":"medium","p":"The table shows average daily time spent on four activities by adults in three countries.\n\nSleeping — Japan 6.8h, Spain 8.1h, Brazil 7.6h\nWorking — Japan 8.9h, Spain 6.4h, Brazil 7.2h\nCommuting — Japan 1.4h, Spain 0.7h, Brazil 1.9h\nLeisure — Japan 2.1h, Spain 4.3h, Brazil 3.0h","tag":"Table comparison"},{"id":"W114","b":7.5,"tier":"hard","p":"The graph shows tourist arrivals and tourism revenue in one country from 2012 to 2022.\n\nArrivals (millions): 2.1 → 3.8 → 4.9 → 0.4 → 3.1\nRevenue (US$ bn): 1.8 → 3.6 → 5.4 → 0.3 → 4.0","tag":"Two variables"},{"id":"W19","b":7.0,"tier":"hard","p":"The maps show a coastal town in 1985 and today.\n\n1985 — small harbour, one hotel, farmland to the north, single coastal road\nToday — expanded marina, four hotels, housing estate on former farmland, bypass road, pedestrianised seafront","tag":"Map comparison"}]},"speaking":{"p1":["Where do you live, and what do you like about it?","Do you prefer studying in the morning or the evening? Why?","How often do you use public transport?","What kind of music did you enjoy as a child?","Is your hometown a good place for young people to live?","Do you think you will keep your current hobbies in ten years?","What do you usually do at weekends?","Do you enjoy cooking? Why or why not?","How important is it to you to keep in touch with old friends?","Do you prefer to travel alone or with others?","What is your favourite time of year, and why?","Do you read newspapers or get your news online?","How has your neighbourhood changed since you were a child?","Do you like taking photographs? What of?","What kind of weather do you find most comfortable?","Do you usually plan your day in advance?","How do you normally relax after a long day?","Is there a shop you visit regularly? What do you buy there?"],"p2":[{"id":"S226","b":6.0,"tier":"medium","title":"Describe a place that is quiet and peaceful.","bullets":["where it is","how you found it","when you go there"],"follow":"And explain why quiet places matter to you."},{"id":"S210","b":6.5,"tier":"medium","title":"Describe a journey that did not go as planned.","bullets":["where you were going","what went wrong","what you did about it"],"follow":"And explain how you would prepare differently now."},{"id":"S214","b":6.5,"tier":"medium","title":"Describe a habit you would like to change.","bullets":["what the habit is","how it started","what you have tried so far"],"follow":"And explain what would make the change stick."},{"id":"S222","b":6.5,"tier":"medium","title":"Describe an event in your community that brings people together.","bullets":["what happens","how often it takes place","who attends"],"follow":"And explain what would be lost if it stopped."},{"id":"S212","b":7.0,"tier":"hard","title":"Describe a public building you find impressive.","bullets":["where it is","what it is used for","what it looks like"],"follow":"And explain what makes it more successful than similar buildings."},{"id":"S240","b":7.5,"tier":"hard","title":"Describe a time when you helped someone with a task you knew little about.","bullets":["who you helped","what the task was","how you managed"],"follow":"And explain what you would do differently."},{"id":"S26","b":7.0,"tier":"hard","title":"Describe a change you would like to see in your city.","bullets":["what the change is","who it would affect","how difficult it would be"],"follow":"And explain why this change matters more than others."},{"id":"S217","b":7.5,"tier":"hard","title":"Describe an area of your country that is very different from where you live.","bullets":["where it is","how it differs","when you first went there"],"follow":"And explain what those differences reveal about the country."},{"id":"S234","b":8.0,"tier":"hardest","title":"Describe a time you had to make a decision without enough information.","bullets":["what the situation was","what you knew","what you decided"],"follow":"And explain how you would judge that decision now."},{"id":"S223","b":8.0,"tier":"hardest","title":"Describe a problem that you solved by thinking differently about it.","bullets":["what the problem was","how you first approached it","what changed"],"follow":"And explain what the experience taught you."},{"id":"S238","b":8.0,"tier":"hardest","title":"Describe a skill that is common in your country but rare elsewhere.","bullets":["what the skill is","who has it","how it is learned"],"follow":"And explain why it developed there."},{"id":"S237","b":8.0,"tier":"hardest","title":"Describe a conversation that changed how you saw someone.","bullets":["who it was with","what you talked about","when it happened"],"follow":"And explain what shifted in your view."}],"p3":["Do you think schools do enough to teach practical skills?","How has technology changed the way people learn new skills?","Should governments fund adult education? Why or why not?","Is it better to specialise deeply or to have broad knowledge?","Will traditional classrooms still exist in fifty years?","Why do some people find it hard to change their habits?","Do you think people are more or less patient than in the past?","How important is it for a city to preserve its old buildings?","Should governments limit the growth of large cities?","Who should be responsible for looking after public spaces?","Is tourism generally good for local communities?","How do you think travel will change in the next twenty years?","Do people value handmade things more than mass-produced ones?","Why do traditions disappear in some societies but survive in others?","Should companies be required to reduce their environmental impact?","Is individual action on the environment worth the effort?","Do you think future generations will judge us harshly?","How does the media influence what people worry about?","Should news organisations be funded by the public?","Is it possible to be well informed without reading widely?"]},"badges":[{"id":"first_steps","ico":"🎯","name":"Calibrated","desc":"Complete the calibration test"},{"id":"streak3","ico":"🔥","name":"Three in a row","desc":"Practise 3 days running"},{"id":"streak7","ico":"⚡","name":"Week of work","desc":"Practise 7 days running"},{"id":"streak30","ico":"🏔️","name":"Month on the mountain","desc":"Practise 30 days running"},{"id":"lvl5","ico":"⭐","name":"Level 5","desc":"Reach level 5"},{"id":"lvl10","ico":"🌟","name":"Level 10","desc":"Reach level 10"},{"id":"rush50","ico":"💨","name":"Word Rush 50","desc":"Score 50+ in Word Rush"},{"id":"perfect","ico":"💎","name":"Flawless","desc":"Finish any drill with no mistakes"},{"id":"writer3","ico":"✍️","name":"Three essays","desc":"Analyse 3 writing samples"},{"id":"speaker3","ico":"🎙️","name":"Three talks","desc":"Complete 3 speaking cards"},{"id":"band7","ico":"🏅","name":"Band 7","desc":"Reach an estimated band of 7.0"},{"id":"xp2000","ico":"👑","name":"2,000 XP","desc":"Earn 2,000 lifetime XP"}]};
let BANK = CORE_BANK;
</script>
<script>
/* ============================================================================
   CORE — storage, state, band mathematics, XP, streaks, routing, feedback
   ============================================================================ */

const KEY = "bandAscent.v1";
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const todayKey=()=>new Date().toISOString().slice(0,10);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtBand=b=>b==null?"—":(Math.round(b*2)/2).toFixed(1);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

/* ---- storage with a graceful in-memory fallback -------------------------- */
const Store=(()=>{
  let ok=true, mem={};
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ ok=false; }
  return {
    persistent:ok,
    get(k){ try{ return ok?localStorage.getItem(k):(mem[k]??null); }catch(e){ return mem[k]??null; } },
    set(k,v){ try{ ok?localStorage.setItem(k,v):(mem[k]=v); }catch(e){ mem[k]=v; } },
    del(k){ try{ ok?localStorage.removeItem(k):delete mem[k]; }catch(e){ delete mem[k]; } }
  };
})();

const blank=()=>({
  v:1, created:Date.now(),
  user:{ name:"", target:7.0, examDate:"", dailyMinutes:30 },
  assessed:false,
  bands:{ overall:null, listening:null, reading:null, writing:null, speaking:null, grammar:null, vocab:null },
  history:[],
  xp:0, streak:0, bestStreak:0, lastDay:null,
  days:{}, badges:[], bests:{}, log:[], writings:[], speakings:[],
  quests:{ date:null, items:[] },
  settings:{ sound:true, notify:false, inactivityMin:30, reminder:"19:00", lastReminded:null, difficulty:"adaptive" }
});

let S = (()=>{ try{ const r=Store.get(KEY); return r?Object.assign(blank(),JSON.parse(r)):blank(); }catch(e){ return blank(); } })();
function save(){ try{ Store.set(KEY, JSON.stringify(S)); }catch(e){} }

/* ---- content pack: load the external library, fall back to the core bank --
   Order of preference: the JSON file sitting next to this page, then a copy
   cached in this browser, then the sample built into the file itself.       */
const PACK_KEY = "bandAscent.pack.v1";
const PACK_FILE = "band-ascent-content.json";
const Content = {
  source:"core", error:null,
  get meta(){ return (BANK && BANK.meta) || {}; },
  get items(){ return this.meta.totalItems || 0; },
  apply(p){ BANK = p; },
  cache(p){
    if(!Store.persistent) return false;
    try{ Store.set(PACK_KEY, JSON.stringify(p)); return Store.get(PACK_KEY)!==null; }
    catch(e){ return false; }   // usually the storage quota
  },
  valid(p){ return !!(p && Array.isArray(p.vocab) && Array.isArray(p.grammar) && Array.isArray(p.reading)); },
  async load(){
    let cached=null;
    try{ const raw=Store.get(PACK_KEY); if(raw) cached=JSON.parse(raw); }catch(e){}
    try{
      const res = await fetch(PACK_FILE, {cache:"no-store"});
      if(res.ok){
        const p = await res.json();
        if(this.valid(p)){ this.apply(p); this.source="file"; this.cache(p); return; }
        this.error="the file was found but is not a valid content pack";
      } else this.error=`the file was not found next to this page (HTTP ${res.status})`;
    }catch(e){
      this.error = location.protocol==="file:"
        ? "browsers block file reads on file:// pages"
        : (e && e.message) || "the file could not be read";
    }
    if(this.valid(cached)){ this.apply(cached); this.source="cached"; return; }
    this.source="core";
  },
  fromFile(file, done){
    const r=new FileReader();
    r.onload=()=>{ let p=null;
      try{ p=JSON.parse(r.result); }catch(e){}
      if(!Content.valid(p)) return done(false);
      Content.apply(p); Content.source="file"; Content.error=null;
      done(true, Content.cache(p));
    };
    r.onerror=()=>done(false);
    r.readAsText(file);
  }
};

/* ---- difficulty tiers ---------------------------------------------------- */
const TIER_ORDER=["easy","medium","hard","hardest"];
const TIER_LABEL={easy:"Easy",medium:"Medium",hard:"Hard",hardest:"Hardest"};
const TIER_BAND={easy:"band 4–5.5",medium:"band 6–6.5",hard:"band 7–7.5",hardest:"band 8+"};
function tierFor(){
  const d=(S.settings && S.settings.difficulty) || "adaptive";
  if(d!=="adaptive" && TIER_ORDER.includes(d)) return d;
  const b=S.bands.overall || 6.0;
  return b<=5.5?"easy" : b<=6.5?"medium" : b<=7.5?"hard" : "hardest";
}
/* Draw from the wanted tier, widening outwards only if there are too few
   items — so an empty tier never produces an empty drill.                   */
function poolOf(name, want, min){
  const all = BANK[name] || [];
  if(!all.length) return [];
  want = want || tierFor(); min = min || 8;
  const i = Math.max(0, TIER_ORDER.indexOf(want));
  let sel = all.filter(x=>x.tier===want);
  for(let step=1; sel.length<min && step<4; step++){
    const lo=TIER_ORDER[i-step], hi=TIER_ORDER[i+step];
    sel = sel.concat(all.filter(x=>x.tier===lo||x.tier===hi));
  }
  return sel.length ? sel : all;
}
function tierPills(onpick){
  const cur=(S.settings.difficulty)||"adaptive";
  return `<div class="seg" role="group" aria-label="Difficulty">
    ${["adaptive",...TIER_ORDER].map(t=>`<button class="${cur===t?"on":""}" onclick="setTier('${t}')" title="${t==="adaptive"?"Matches your current band":TIER_BAND[t]}">${t==="adaptive"?"Adaptive":TIER_LABEL[t]}</button>`).join("")}
  </div>`;
}
function setTier(t){
  S.settings.difficulty=t; save();
  toast("Difficulty set", t==="adaptive"
    ? `Items will now match your current band (${TIER_LABEL[tierFor()]}).`
    : `Drills will draw from ${TIER_LABEL[t].toLowerCase()} items (${TIER_BAND[t]}).`, "🎚️", 3200);
  if(current==="arena") renderArena(); else if(current==="settings") renderSettings();
}

/* ---- band mathematics ---------------------------------------------------- */
/* Adaptive ability estimate. Each answer nudges theta toward or away from the
   item's difficulty, weighted by how surprising the outcome was.             */
function updateTheta(theta,itemBand,correct,k=0.30){
  const surprise = correct ? Math.max(0.4, 1+(itemBand-theta)) : Math.max(0.4, 1+(theta-itemBand));
  return clamp(theta + (correct? k*surprise : -k*surprise), 3.0, 9.0);
}
const roundBand = b => b==null?null:clamp(Math.round(b*2)/2, 2.5, 9);
/* half-band rounding without the 2.5 floor — for differences, not scores */
const half = v => Math.round(v*2)/2;

/* Shrink a band derived from very few items toward a neutral prior, so that
   4 correct answers out of 4 does not read as a band 9.                      */
function shrink(band, n, prior=6.0, weight=2){
  if(!n) return prior;
  return (n*band + weight*prior)/(n+weight);
}

/* Official-style raw-score to band conversion, used for the fixed sections */
function bandFromRatio(r, ceiling=9){
  const table=[[0.97,9],[0.92,8.5],[0.85,8],[0.78,7.5],[0.70,7],[0.62,6.5],[0.53,6],[0.44,5.5],[0.35,5],[0.26,4.5],[0.17,4],[0,3.5]];
  for(const [t,b] of table) if(r>=t) return Math.min(b,ceiling);
  return 3.5;
}

/* ---- XP and levels ------------------------------------------------------- */
const xpForLevel = n => 120 + (n-1)*70;                 // cost of level n -> n+1
function levelInfo(xp){
  let lvl=1, rem=xp;
  while(rem >= xpForLevel(lvl)){ rem-=xpForLevel(lvl); lvl++; if(lvl>99) break; }
  return { level:lvl, into:rem, need:xpForLevel(lvl), pct: Math.round(rem/xpForLevel(lvl)*100) };
}

function addXP(n, label, ev){
  if(!n) return;
  const before=levelInfo(S.xp).level;
  S.xp += n;
  const d=todayKey();
  S.days[d]=S.days[d]||{xp:0,mins:0,sessions:0,tasks:[]};
  S.days[d].xp += n;
  const after=levelInfo(S.xp).level;
  try{ floatXP(n, ev); }catch(e){}
  if(after>before){ try{celebrate();}catch(e){} toast(`Level ${after}`, "New level reached. Harder items are now in rotation.", "⬆️"); }
  checkBadges(); save(); paintChrome();
}

function logSession(kind, detail, xp, minutes){
  const d=todayKey();
  S.days[d]=S.days[d]||{xp:0,mins:0,sessions:0,tasks:[]};
  S.days[d].mins += minutes||0;
  S.days[d].sessions += 1;
  S.log.unshift({ t:Date.now(), kind, detail, xp:xp||0 });
  S.log = S.log.slice(0,200);
  touchStreak();
  save();
}

/* ---- streak -------------------------------------------------------------- */
function touchStreak(){
  const d=todayKey();
  if(S.lastDay===d) return;
  if(S.lastDay && daysBetween(S.lastDay,d)===1) S.streak+=1;
  else S.streak=1;
  S.lastDay=d;
  S.bestStreak=Math.max(S.bestStreak,S.streak);
  if(S.streak>1) toast(`${S.streak}-day streak`, "Consistency is what moves a band score.", "🔥");
  save();
}
/* a streak is broken silently on load if a day was missed */
function auditStreak(){
  if(!S.lastDay) return;
  const gap=daysBetween(S.lastDay,todayKey());
  if(gap>1) S.streak=0;
}

/* ---- badges -------------------------------------------------------------- */
function grant(id){
  if(S.badges.includes(id)) return;
  const b=BANK.badges.find(x=>x.id===id); if(!b) return;
  S.badges.push(id); save(); try{celebrate();}catch(e){}
  toast("Badge unlocked", `${b.ico} ${b.name} — ${b.desc}`, "🏆");
}
function checkBadges(){
  const L=levelInfo(S.xp).level;
  if(S.assessed) grant("first_steps");
  if(S.streak>=3) grant("streak3");
  if(S.streak>=7) grant("streak7");
  if(S.streak>=30) grant("streak30");
  if(L>=5) grant("lvl5");
  if(L>=10) grant("lvl10");
  if((S.bests.rush||0)>=50) grant("rush50");
  if(S.writings.length>=3) grant("writer3");
  if(S.speakings.length>=3) grant("speaker3");
  if((S.bands.overall||0)>=7) grant("band7");
  if(S.xp>=2000) grant("xp2000");
}

/* ---- feedback: toasts, confetti, floating xp -----------------------------
   These are decoration. They are wrapped so that a missing browser API can
   never interrupt scoring or saving.                                        */
const reduceMotion = () => {
  try{ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch(e){ return false; }
};
function toast(title, body, ico="✅", ms=4200){
  const host=$("#toasts"); const el=document.createElement("div");
  el.className="toast";
  el.innerHTML=`<span style="font-size:1.1rem;line-height:1.2">${ico}</span><div><b>${esc(title)}</b><div class="small" style="color:#B9CCDA;margin-top:2px">${esc(body)}</div></div>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s,transform .3s"; el.style.opacity=0; el.style.transform="translateX(20px)"; setTimeout(()=>el.remove(),320); }, ms);
}
function celebrate(){
  if(reduceMotion()) return;
  const host=$("#confetti"); if(!host) return;
  host.classList.remove("hidden"); host.innerHTML="";
  const cols=["#E8A32D","#0E7C86","#17A673","#6D5BD0","#D64545"];
  for(let i=0;i<48;i++){
    const p=document.createElement("i");
    p.style.left=Math.random()*100+"vw"; p.style.top="-20px";
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.4+Math.random()*1.4)+"s";
    p.style.animationDelay=(Math.random()*.4)+"s";
    host.appendChild(p);
  }
  setTimeout(()=>{ host.classList.add("hidden"); host.innerHTML=""; }, 2900);
}
function floatXP(n, ev){
  if(reduceMotion()) return;
  try{
    const el=document.createElement("div"); el.className="float-xp"; el.textContent="+"+n+" XP";
    const x=ev&&ev.clientX?ev.clientX:window.innerWidth-120, y=ev&&ev.clientY?ev.clientY:120;
    el.style.left=x+"px"; el.style.top=y+"px";
    document.body.appendChild(el);
    if(el.animate) el.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-46px)",opacity:0}],{duration:900,easing:"cubic-bezier(.2,1,.3,1)"});
    setTimeout(()=>el.remove(),900);
  }catch(e){}
}
function modal(html){
  const host=$("#modalHost");
  host.innerHTML=`<div class="scrim" id="scrim"><div class="modal">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeModal(); });
}
function closeModal(){ $("#modalHost").innerHTML=""; }

/* ---- band dial (the signature element) ----------------------------------- */
function dialSVG(band, sub){
  const b = band==null ? 0 : band;
  const ang = -90 + (clamp(b,0,9)/9)*180;
  let ticks="";
  for(let i=0;i<=18;i++){
    const t=-90+(i/18)*180, rad=t*Math.PI/180, major=i%2===0;
    const r1=major?66:72, r2=78;
    const x1=100+Math.sin(rad)*r1, y1=92-Math.cos(rad)*r1;
    const x2=100+Math.sin(rad)*r2, y2=92-Math.cos(rad)*r2;
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${major?'#5B7C93':'#33556E'}" stroke-width="${major?1.6:1}"/>`;
    if(major && i%4===0){
      const lx=100+Math.sin(rad)*56, ly=92-Math.cos(rad)*56;
      ticks+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="9" font-family="JetBrains Mono, monospace" fill="#6C8DA4">${i/2}</text>`;
    }
  }
  const arcEnd = -90+(clamp(b,0,9)/9)*180;
  const pol=(a,r)=>[100+Math.sin(a*Math.PI/180)*r, 92-Math.cos(a*Math.PI/180)*r];
  const [ax,ay]=pol(-90,84), [bx,by]=pol(arcEnd,84);
  const large = (arcEnd - -90) > 180 ? 1 : 0;
  return `<svg viewBox="0 0 200 108" width="100%" style="max-width:330px" role="img" aria-label="Band ${fmtBand(band)} of 9">
    <path d="M16 92 A84 84 0 0 1 184 92" fill="none" stroke="#22405A" stroke-width="7" stroke-linecap="round"/>
    ${b>0?`<path d="M${ax.toFixed(1)} ${ay.toFixed(1)} A84 84 0 ${large} 1 ${bx.toFixed(1)} ${by.toFixed(1)}" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round"/>`:""}
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E7C86"/><stop offset="1" stop-color="#E8A32D"/></linearGradient></defs>
    ${ticks}
    <g class="needle" style="transform:rotate(${ang}deg)">
      <line x1="100" y1="92" x2="100" y2="26" stroke="#E8A32D" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="100" cy="26" r="3.4" fill="#E8A32D"/>
    </g>
    <circle cx="100" cy="92" r="7" fill="#0F2233" stroke="#E8A32D" stroke-width="2"/>
  </svg>`;
}
function dialPanel(band, caption, sub){
  return `<div class="dial-panel">
    <div class="eyebrow" style="color:#7E9AAF">${esc(caption||"Estimated band")}</div>
    <div class="dial-wrap" style="margin-top:8px">
      ${dialSVG(band)}
      <div class="dial-readout"><div class="dial-num">${fmtBand(band)}</div><div class="dial-label">${esc(sub||"of 9.0")}</div></div>
    </div>
  </div>`;
}

/* ---- speech -------------------------------------------------------------- */
const Speech = {
  ok: typeof speechSynthesis!=="undefined",
  voice:null,
  init(){ if(!this.ok) return; const load=()=>{ const v=speechSynthesis.getVoices();
      this.voice = v.find(x=>/en-GB/i.test(x.lang)) || v.find(x=>/en-AU|en-NZ/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || v[0] || null; };
    load(); speechSynthesis.onvoiceschanged=load; },
  say(text, rate=0.95, onend){
    if(!this.ok){ onend&&onend(); return; }
    try{ speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=rate; u.pitch=1; if(this.voice) u.voice=this.voice;
      u.onend=()=>onend&&onend(); u.onerror=()=>onend&&onend();
      speechSynthesis.speak(u);
    }catch(e){ onend&&onend(); }
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};

/* ---- routing ------------------------------------------------------------- */
const VIEWS=["home","plan","arena","progress","settings","play","assess","onboard"];
let current="home";
function go(view, opts){
  Speech.stop(); stopAllTimers(); closeModal();
  VIEWS.forEach(v=>$("#view-"+v).classList.toggle("hidden", v!==view));
  $$(".nav-btn").forEach(b=>{ const on=b.dataset.view===view; b.classList.toggle("on",on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  current=view; try{ window.scrollTo(0,0); }catch(e){}
  if(view==="home") renderHome();
  if(view==="plan") renderPlan();
  if(view==="arena") renderArena();
  if(view==="progress") renderProgress();
  if(view==="settings") renderSettings();
}
$$(".nav-btn").forEach(b=>b.addEventListener("click",()=>{
  if(!S.assessed && b.dataset.view!=="settings"){ toast("Calibration first","Take the calibration test so the app can build your plan.","🎯"); return; }
  go(b.dataset.view);
}));

/* ---- timers -------------------------------------------------------------- */
let TIMERS=[];
function every(fn,ms){ const id=setInterval(fn,ms); TIMERS.push(id); return id; }
function later(fn,ms){ const id=setTimeout(fn,ms); TIMERS.push(id); return id; }
function stopAllTimers(){ TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t);}); TIMERS=[]; }

/* ---- chrome (rail numbers) ---------------------------------------------- */
function paintChrome(){
  const li=levelInfo(S.xp);
  const rs=$("#railStreak"), rx=$("#railXp"), rl=$("#railLvl");
  if(rs) rs.textContent=`${S.streak} day${S.streak===1?"":"s"}`;
  if(rx) rx.style.width=li.pct+"%";
  if(rl) rl.textContent=`Level ${li.level} · ${li.into}/${li.need} XP`;
}

/* ---- reminders and inactivity ------------------------------------------- */
const Nudge={
  timer:null,
  reset(){
    clearTimeout(this.timer);
    const mins=S.settings.inactivityMin||30;
    this.timer=setTimeout(()=>this.fire(), mins*60000);
  },
  fire(){
    const q=todayQuests().filter(x=>!x.done).length;
    const msg = q ? `${q} task${q===1?"":"s"} left in today's plan. A ten-minute drill keeps the streak alive.`
                  : "You have been idle for a while. A short drill now is worth an hour later.";
    toast("Time to practise", msg, "⏰", 9000);
    this.push("Band Ascent", msg);
    this.reset();
  },
  push(title, body){
    if(!("Notification" in window)) return;
    if(Notification.permission!=="granted") return;
    try{ new Notification(title,{ body, icon:"", tag:"band-ascent" }); }catch(e){}
  },
  async ask(){
    if(!("Notification" in window)){ toast("Not supported","This browser cannot show desktop notifications. In-app reminders still work.","ℹ️"); return false; }
    const p=await Notification.requestPermission();
    S.settings.notify = p==="granted"; save();
    toast(p==="granted"?"Reminders on":"Reminders blocked",
          p==="granted"?"You will be nudged after a period of inactivity while the app is open.":"Allow notifications in your browser settings to enable this.",
          p==="granted"?"🔔":"🔕");
    return p==="granted";
  },
  /* daily reminder check while the tab is open */
  clock(){
    setInterval(()=>{
      const t=S.settings.reminder; if(!t) return;
      const now=new Date(), hhmm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
      const d=todayKey();
      if(hhmm===t && S.settings.lastReminded!==d && !(S.days[d]&&S.days[d].sessions)){
        S.settings.lastReminded=d; save();
        toast("Daily practice", "This is your scheduled practice time.", "📚", 10000);
        this.push("Daily practice","This is your scheduled Band Ascent practice time.");
      }
    }, 30000);
  }
};
let idleTick=0;
["click","keydown","touchstart","mousemove","scroll"].forEach(e=>window.addEventListener(e,()=>{
  const now=Date.now(); if(now-idleTick<5000) return; idleTick=now; Nudge.reset();
},{passive:true}));
</script>
<script>
/* ============================================================================
   ONBOARDING · CALIBRATION TEST · WRITING ANALYSER · PLAN GENERATOR
   ============================================================================ */

/* ------------------------------------------------------------- ONBOARDING */
function renderOnboard(){
  $("#view-onboard").innerHTML=`
  <div style="max-width:760px;margin:clamp(10px,5vh,60px) auto 0">
    <div class="rise" style="margin-bottom:22px">
      <div class="eyebrow">Band Ascent · offline IELTS trainer</div>
      <h1 style="margin-top:8px">Find out where you actually stand.</h1>
      <p class="muted" style="margin-top:10px;max-width:56ch">A 25-minute adaptive calibration across listening, reading, grammar, vocabulary and writing. It gets harder when you are right and easier when you are wrong, so it lands on a band estimate rather than a percentage.</p>
      <div class="rowwrap" style="margin-top:12px">${libraryChip()}
        <span class="pill">4 difficulty tiers</span><span class="pill">drawn at random each session</span></div>
    </div>

    <div class="split rise">
      <div class="card">
        <h3 style="margin-bottom:14px">Before you start</h3>
        <label class="small muted">What should the app call you?</label>
        <input class="field" id="obName" placeholder="Your name" style="margin:6px 0 14px" autocomplete="given-name">
        <label class="small muted">Target band</label>
        <select class="field" id="obTarget" style="margin:6px 0 14px">
          <option value="6">6.0</option><option value="6.5">6.5</option>
          <option value="7" selected>7.0</option><option value="7.5">7.5</option>
          <option value="8">8.0</option><option value="8.5">8.5</option>
        </select>
        <div class="grid g2" style="gap:12px">
          <div><label class="small muted">Test date (optional)</label>
            <input class="field" id="obDate" type="date" style="margin-top:6px"></div>
          <div><label class="small muted">Minutes per day</label>
            <select class="field" id="obMins" style="margin-top:6px">
              <option>15</option><option selected>30</option><option>45</option><option>60</option>
            </select></div>
        </div>
        <button class="btn gold wide" style="margin-top:18px" onclick="startCalibration()">Start the calibration test</button>
        <p class="tiny muted center" style="margin-top:10px">Everything stays on this device. No account, no server.</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        ${dialPanel(null,"Your band","not yet measured")}
        <div class="card tight">
          <div class="eyebrow" style="margin-bottom:10px">What the test covers</div>
          ${[["Listening",`4 items, drawn from ${BANK.listening.length} recordings`],["Reading",`6 items on 1 of ${BANK.reading.length} passages`],["Grammar",`8 adaptive items from ${BANK.grammar.length}`],["Vocabulary",`7 adaptive items from ${BANK.vocab.length}`],["Writing","one short response, analysed on four criteria"]]
            .map(([a,b])=>`<div class="kv"><b>${a}</b><span class="muted small">${b}</span></div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
  if(Store.persistent===false){
    $("#view-onboard").insertAdjacentHTML("afterbegin",
      `<div class="banner"><span>⚠️</span><div>This browser is blocking local storage, so progress will not survive a refresh. Save the file to your device and open it directly to keep your history.</div></div>`);
  }
}

/* -------------------------------------------------------- CALIBRATION TEST */
let AS=null;

function startCalibration(){
  S.user.name   = ($("#obName")?.value||"").trim();
  S.user.target = parseFloat($("#obTarget")?.value||"7");
